                     drop_outside(src, [...e.dataTransfer.files]);
                   }}>
    <i class="beak" style=${`left:${((beak ?? 0.5) * 100).toFixed(3)}%`}></i>
    <div class="head">
      ${/* Шапка из двух частей: слева всё про саму дискету — оно переносится по
           строкам, сколько бы кнопок ни появилось, — а справа, в самом углу,
           порядок показа. Без этой пары порядок уезжал бы в конец
           переносимого ряда и оказывался не в углу, а где придётся. */''}
      <div class="hleft">
      <b>${t('Disk %1', num(n))}</b>
      ${moved && html`<span class="note warn">${
         t('shows disk %1 — swap not applied yet', num(src))}</span>`}
      <${LabelEdit} n=${src}/>
      ${/* Области не создаются — они появляются вместе с первым файлом. Этот
           выбор лишь показывает пустой ряд, чтобы было куда положить: дальше
           работает обычное перетаскивание, без своих правил. */''}
      <select class="sm" value=""
        data-tip=${t('show an empty user area so files can be dropped into it')}
        onChange=${e => {
          const a = +e.target.value;
          e.target.value = '';
          if (!Number.isInteger(a)) return;
          if (!st.areas.has(src)) st.areas.set(src, new Set());
          st.areas.get(src).add(a);
          bump();
        }}>
        <option value="">${t('+ area')}</option>
        ${Array.from({ length: 16 }, (_, i) => i)
           .filter(i => !by_area.has(i))
           .map(i => html`<option key=${i} value=${i}>${t('user %1', i)}</option>`)}
      </select>
      ${/* «Save .fdd» и «Erase floppy» — значками на плитке дискеты, там же,
           где они у файла. */''}
      <button class="sm" onClick=${() => pick.current.click()}>${t('Add files…')}</button>
      ${/* Появляется вместе с выделением и уходит с ним — как «Отменить
           правки» с правками и «Починить» с потерянными записями. Правило в
           шапке одно: кнопка есть, когда ей есть что делать. Погашенная
           кнопка на постоянном месте была бы третьим поведением. */''}
      ${st.sel.size > 0 && html`<button class="sm danger"
        data-tip=${t('remove the selected files from this disk')}
        onClick=${() => undoable(t('delete %1',
                                   plural(st.sel.size, 'file', 'files')),
                                 () => remove_sel(src))}
        >${t('Delete %1', plural(st.sel.size, 'file', 'files'))}</button>`}
      <input type="file" multiple ref=${pick} style="display:none"
             onChange=${e => { undoable_async(
                                 t('%1 to disk %2',
                                   plural(e.target.files.length, 'file', 'files'),
                                   num(src)),
                                 () => take_files(src, [...e.target.files]));
                               e.target.value = '' }}/>
      ${dmg.safe.length > 0 && html`<button class="sm"
        data-tip=${t('lost directory entries: neither free nor a file. ' +
                      'Rewriting them to E5h gives them back')}
        onClick=${() => say(t('repaired %1',
                             plural(stage_repair(src), 'entry', 'entries')), 'ok')}
        >${t('Repair %1', plural(dmg.safe.length, 'entry', 'entries'))}</button>`}
      ${projected.has(src) && html`<button class="sm"
        onClick=${() => { drop_changes(src); toast('') }}
        >${t('Undo changes')}</button>`}
      ${order.has(n) && html`<button class="sm"
        onClick=${() => { undoable(t('undo swap on disk %1', num(n)),
                               () => unswap(n)); toast('') }}
        >${t('Undo swap')}</button>`}
      </div>
      ${/* Порядок файлов — здесь, у самих файлов, а не в строке поиска: там он
           стоял бы среди того, что относится ко всему диску, и читался бы как
           «искать по имени». Настройка при этом одна на все дискеты — панель тоже одна,
           и заводить порядок отдельно каждой дискете незачем.

           Подпись отдельным словом, а не внутри пунктов: в закрытом виде рядом
           читается «sort by: name», а в раскрытом список остаётся коротким —
           name, type, size, — и не повторяет «by» трижды. */''}
      ${/* Подпись лежит ВНУТРИ поля, как лупа внутри поиска: место под неё
           отведено левым отступом, а сама она наложена сверху и мышь не ловит.
           Иначе никак: у поля выбора закрытый вид рисует браузер по тексту
           выбранного пункта, и «sort by:» пришлось бы вписать в сами пункты —
           тогда оно повторялось бы трижды в раскрытом списке. */''}
      <label class="inline sortby">
        <span class="cap">${t('sort by:')}</span>
        <select class="sm" value=${st.sort} data-tip=${t('how files are ordered in a disk')}
                onChange=${e => { st.sort = e.target.value;
                                  pref_set('sort', st.sort); bump() }}>
          <option value="name">${t('name')}</option>
          <option value="type">${t('type')}</option>
          <option value="size">${t('size')}</option>
        </select></label>
    </div>
    ${dmg.risky.length > 0 && html`<p class="note warn">${
      t('%1 left alone: they point at real blocks and may be a file whose first ' +
        'byte got clobbered. Freeing them would hand those blocks out for reuse.',
        plural(dmg.risky.length, 'damaged entry', 'damaged entries'))}</p>`}
    ${!cat ? html`<p class="note busy">${t('reading directory…')}</p>`
     : !cat.length ? html`<p class="note">${t('disk is empty')}</p>`
     : html`${areas.map(area => html`
       <div class=${'agroup' + (st.area_drop === area ? ' take' : '')}
            key=${'a' + area}
            onDragOver=${e => {
              if (!e.dataTransfer.types.includes(DRAG_FILE)) return;
              e.preventDefault();
              /* Между областями одного диска — перенос, с чужого — копия. */
              e.dataTransfer.dropEffect = +e.dataTransfer.getData(DRAG_FILE) ? 'copy' : 'move';
              if (st.area_drop !== area) { st.area_drop = area; bump() }
            }}
            onDragLeave=${() => { if (st.area_drop === area) { st.area_drop = -1; bump() } }}
            onDrop=${e => {
              const carried = e.dataTransfer.getData(DRAG_FILE);
              if (!carried) return;
              e.preventDefault(); e.stopPropagation();
              st.area_drop = -1; st.dragging_files = 0;
              const { floppy, keys } = JSON.parse(carried);
              move_files(floppy, src, keys, area);
            }}>
         ${/* Подпись есть у КАЖДОЙ области, включая нулевую: без подписи ряд
              читался бы как «файлы вообще», а не как область, и куда падает
              брошенное, было бы неясно. */''}
         <div class="asep"><b>${t('user %1', area)}</b>
           <span>${plural(by_area.get(area).length, 'file', 'files')}</span></div>
         ${by_area.get(area).length
           ? html`<div class="fgrid">${by_area.get(area).map(f =>
               html`<${FileTile} key=${fkey(f)} f=${f} src=${src}
                                 cat=${cat} pat=${pat} say=${say}/>`)}</div>`
           : html`<p class="note">${t('empty — drop files here')}</p>`}
       </div>`)}`}
    ${/* Сколько места осталось — ПОД списком, а не в шапке. В шапке эта строка
         стояла бы среди того, чем управляют, а говорит она про то, что показано
         ниже, и читают её после списка, а не до. */''}
    <p class="note free">${free_note(src)}</p>
  </div>`;
}

/* Сетка плиток с раскрытием.
 *
 * Панель встаёт после ПОСЛЕДНЕЙ плитки того ряда, где стоит выбранная: только
 * так ряд «раздвигается», а не рвётся посередине. Сколько плиток в ряду —
 * спрашиваем у самой сетки, потому что рядность задана auto-fill и меняется от
 * ширины окна.
 *
 * Наблюдатель за сеткой, а не только resize у окна: рядность меняется и без
 * изменения окна, например когда доедут шрифты. Сверяем ЧИСЛО СТОЛБЦОВ, а не
 * размер, иначе вставка панели меняла бы высоту и будила наблюдателя без конца.
 */
/* Заглушка на месте спрятанных пустых дискет. Раскрывается наведением, а не
 * броском: бросить надо в конкретную дискету, а не «куда-нибудь сюда» — номер
 * тут физический, и выбирать его должен человек. */
function GapTile({ from, to, onOpen, off }) {
  if (off) return html`<div class="gap off"></div>`;
  const k = to - from + 1;
  return html`<div class="gap"
    data-tip=${t('%1 hidden here — hover to show',
                 plural(k, 'empty disk', 'empty disks'))}
    onDragOver=${e => { e.preventDefault(); onOpen() }}>
    <b>${from}${k > 1 ? '–' + to : ''}</b>
    <span>${k} empty</span>
  </div>`;
}

function Floppies() {
  const grid = useRef();
  const [cols, setCols] = useState(1);

  useEffect(() => {
    const el = grid.current;
    const upd = () => {
      const c = getComputedStyle(el).gridTemplateColumns.split(' ').length;
      setCols(p => (p === c ? p : c));
    };
    upd();
    const ro = new ResizeObserver(upd);
    ro.observe(el);
    addEventListener('resize', upd);
    return () => { ro.disconnect(); removeEventListener('resize', upd) };
  }, []);

  const open = n => { st.open = st.open === n ? 0 : n; bump();
                      if (st.open) ensure_dir(src_of(st.open)) };

  /* Сетка строится ЦЕЛИКОМ и всегда одной длины: и спрятанные пустые дискеты,
   * и заглушки разрывов сидят в списке постоянно, а прячутся стилем.
   *
   * Вставлять заглушки в начале перетаскивания нельзя: те, что оказываются
   * перед взятой плиткой, сдвигают её узел, а браузер считает перенос узла
   * отменой перетаскивания. Список постоянной длины эту беду снимает целиком:
   * узлы не двигаются, меняются только классы.
   */
  const pat = st.find.trim();
  const dragging = st.showgaps;

  const tiles = [];
  if (geom) {
    for (let n = 1; n <= geom.floppies; n++) {
      /* Всё по МЕСТУ n, а содержимое — той дискеты, что на нём окажется. */
      const cat = cat_of(src_of(n));
      /* Правило одно, без исключений: пустая скрыта, и точка. Речь при этом о
         том, что лежит НА ДИСКЕ. Дискету, которую правят прямо сейчас, прятать
         нельзя: очистив её, пользователь остался бы без плитки, без панели и
         без «Undo changes» — отменить было бы нечем. */
      const vis = pat
        ? !!(cat && cat.some(f => match(pat, f.name)))
        : !(st.hide && cat !== undefined && !cat.length &&
            !projected.has(n) && !order.has(n));
      tiles.push({ n, vis });
    }
  }

  /* Разрывы: между соседними видимыми дискетами прячется цепочка невидимых.
     Раскрытый разрыв показывает свою цепочку и убирает собственную заглушку. */
  const gap_after = new Map();
  if (!pat) {
    let last = -1;
    for (let i = 0; i < tiles.length; i++) {
      if (!tiles[i].vis) continue;
      if (last >= 0 && i > last + 1) {
        const key = tiles[last].n;
        /* ОДИНОЧНЫЙ РАЗРЫВ НЕ СВОРАЧИВАЕМ. Заглушка занимает ровно столько же
           места, сколько сама дискета, — сворачивать одну в одну значит просить
           лишнее нажатие ни за что. Показываем саму дискету, и бросить в неё
           можно сразу.

           Только на время перетаскивания: вне его пустые прячутся, и это как
           раз то, ради чего они прячутся. */
        if (i === last + 2) {
          if (dragging) tiles[last + 1].vis = true;
        } else {
          const open_gap = st.gaps.has(key);
          gap_after.set(key, { from: tiles[last + 1].n, to: tiles[i - 1].n, open: open_gap });
          if (open_gap) for (let k = last + 1; k < i; k++) tiles[k].vis = true;
        }
      }
      last = i;
    }
  }

  const kids = [], vis_of = [];
  let open_at = -1, vis_count = 0;
  for (const t of tiles) {
    if (t.n === st.open && t.vis) open_at = vis_count;
    if (t.vis) vis_count++;
    kids.push(html`<${Tile} key=${t.n} n=${t.n} off=${!t.vis} onOpen=${open}/>`);
    vis_of.push(t.vis);

    const g = gap_after.get(t.n);
    if (!g) continue;
    const g_vis = dragging && !g.open;
    if (g_vis) vis_count++;
    kids.push(html`<${GapTile} key=${'gap' + t.n} from=${g.from} to=${g.to}
                               off=${!g_vis}
                               onOpen=${() => { st.gaps.add(t.n); bump() }}/>`);
    vis_of.push(g_vis);
  }

  /* Панель встаёт после последней ВИДИМОЙ плитки того ряда, где стоит открытая.
     Считать приходится по видимым, а вставлять по месту в списке: спрятанные
     сидят в нём вперемешку и в ряды не входят. */
  if (open_at >= 0) {
    const row_end = Math.min((Math.floor(open_at / cols) + 1) * cols, vis_count);
    let seen = 0, at = kids.length;
    for (let i = 0; i < kids.length; i++) {
      if (vis_of[i]) seen++;
      if (seen === row_end) { at = i + 1; break }
    }
    /* Доля ширины, на которой стоит середина раскрытой плитки: столбец плюс
       половина, делённые на число столбцов. Ряды одинаковые, поэтому одного
       остатка от деления хватает. */
    const beak = cols > 0 ? ((open_at % cols) + 0.5) / cols : 0.5;
    kids.splice(at, 0, html`<${Panel} key="panel" n=${st.open} beak=${beak}/>`);
  }

  /* Итог обхода стоит В ОДНОМ месте, в верхней строке: снизу он повторял бы то
     же самое, и нового там было бы только «сколько с файлами». Внизу остаётся лишь
     то, чего наверху нет, — что нашёл поиск. */
  const seen = dirs.size, full = [...dirs.values()].filter(c => c.length).length;
  const note = st.find.trim()
    ? (seen < (geom ? geom.floppies : 0)
        ? t('searching the %1 disks read so far — the rest are not read yet', seen)
        : t('disks with this file: %1', vis_count))
    : '';
  /* Складывается ЗДЕСЬ, а не в st: в состоянии лежат числа, а не готовый
     текст. Иначе строка, сложенная во время обхода, так и оставалась бы на
     языке, который был выбран тогда, — переключение её не трогало. */
  const sc = st.scan;
  const scanned =
      !sc                      ? ''
    : sc.total !== undefined   ? t('scanned %1 of %2…', sc.done, sc.total)
    : st.scanning || !seen     ? t('read %1 in %2 s',
                                   plural(sc.done, 'disk', 'disks'), sc.secs)
    : t('%1, %2 with files',
        t('read %1 in %2 s', plural(sc.done, 'disk', 'disks'), sc.secs), full) +
      (bad.size ? t(', %1 failed', bad.size) : '');

  return html`<div>
    <div class="bar">
      <label class="find">${ICON_FIND}
        <input type="search" placeholder=${t('find file: *.COM or NAME')} value=${st.find}
               onInput=${e => { st.find = e.target.value; bump() }}/></label>
      <label class="sw">
        <input type="checkbox" checked=${!st.hide}
               onChange=${e => { st.hide = !e.target.checked;
                                 pref_set('hide', st.hide ? '1' : '0'); bump() }}/>
        <span class="track"><i></i></span>${t('show empty')}</label>
      <${Basket}/>
    </div>
    <div class="grid" ref=${grid}>${kids}</div>
    ${/* Итог обхода стоит ПОД сеткой, а не в строке поиска: он про то, что уже
         показано выше, и наверху занимал бы место рядом с тем, чем управляют. */''}
    <p class="scan">${scanned}${note && html` · ${note}`}<${Version}/></p>
  </div>`;
}

/* Доля ширины, на которой стоит середина раскрытой плитки: столбец плюс
 * половина, делённые на число столбцов. Ряды одинаковые, поэтому одного
 * остатка от деления хватает.
 *
 * Отдельной функцией, потому что это единственное здесь, что бывает
 * неправильным: в проверках без браузера ширин нет, столбец там всегда один, и
 * ошибку в этой арифметике поймает только прямая проверка. */
const beak_at = (at, cols) =>
  cols > 0 && at >= 0 ? ((at % cols) + 0.5) / cols : 0.5;

/* Каталог диска по требованию: панель открывается сразу, а читается следом. */
async function ensure_dir(n) {
  if (dirs.has(n) || bad.has(n)) return;
  try { dirs.set(n, await readDir(n)) }
  catch (e) { bad.set(n, e.message) }
  bump();
}

function PendingBar() {
  const say = (text, cls) => toast(text, cls);
  const total = has_changes();
  if (!total) return null;

  const what = [
    ...[...projected.keys()].sort((a, b) => a - b).map(n => {
      const before = dirs.get(n) || [], after = parseDir(projected.get(n).dir_image());
      const add = after.filter(f => !before.some(g => g.user === f.user && g.name === f.name));
      const del = before.filter(f => !after.some(g => g.user === f.user && g.name === f.name));
      const bits = [];
      if (add.length) bits.push(`+${add.length}`);
      if (del.length) bits.push(`−${del.length}`);
      /* Починка не добавляет и не убирает файлов, и без этой строки изменение
         выглядело бы безымянным: «disk 1» и ничего больше. */
      const lost = dir_stats(dirRaw.get(n)).bad_slots -
                   dir_stats(projected.get(n).dir_image()).bad_slots;
      if (lost > 0) bits.push(t('%1 recovered', lost));
      return t('disk %1', num(n)) + (bits.length ? ': ' + bits.join(' ') : '');
    }),
    ...[...images.keys()].sort((a, b) => a - b)
        .map(n => t('disk %1 \u2190 %2', num(n), images.get(n).name)),
    ...swap_cycles().map(c => c.length === 2
      ? t('disks %1 ⇄ %2', num(c[0]), num(c[1]))
      /* Цепочка: место берёт у следующего, последнее — у первого. Стрелка
         показывает, куда едет содержимое. */
      : t('disks %1 → %2', [...c].reverse().map(num).join(' → '),
            num(c[c.length - 1]))),
    ...[...pending.values()].map(p => p.text.trim()
      ? t('label on disk %1 → “%2”', num(p.floppy), p.text.trim())
      : t('clear label on disk %1', num(p.floppy))),
  ].join(' · ');

  return html`<div class="pend">
    <b>${plural(total, 'pending change', 'pending changes')}</b>
    <span class="note">${what}</span>
    ${/* Кнопки прижаты к правому краю и не зависят от длины перечня слева: он
         растёт с каждой правкой, и без этого «Apply» уезжала бы из-под курсора
         тем дальше, чем больше сделано. */''}
    ${/* Погашена, пока плата заперта: нажимать её тогда некуда, а объяснять
         отказом каждый раз — хуже, чем показать сразу. */''}
    <button class="go" disabled=${!can_write()}
      data-tip=${can_write() ? '' : t('this board is flashed read-only')}
      onClick=${() => apply_pending(say)}>${t('Apply')}</button>
    ${/* Шаг назад стоит перед «Отменить правки»: у них соседние места и разная
         цена ошибки, и тот, что дешевле, должен попадаться раньше. Показываем,
         ЧТО именно отменится, — иначе нажимать её приходится наугад. */''}
    ${can_undo() && html`<button class="sm"
      data-tip=${t('undo the last step: %1', undo_what())}
      onClick=${() => undo(say)}>${t('Undo')}</button>`}
    ${/* «Отменить правки» само по себе откатывается: нажать её случайно, потеряв
         три десятка набранных изменений, обиднее всего остального. */''}
    <button class="sm"
      onClick=${() => undoable(t('discard all changes'), () => drop_changes())}
      >${t('Discard')}</button>
  </div>`;
}

/* ---------------------------------------------------------------- подсказки
 *
 * Своя, а не родная: родную браузер держит около секунды и это не настраивается
 * — а подсказки тут короткие, по одному слову, и ждать их незачем.
 *
 * Одна на всю страницу: узел заводится единожды и переезжает к тому, на что
 * навели. Триста плиток по два значка — это шестьсот подсказок, и заводить их
 * заранее в разметке значило бы шестьсот лишних узлов.
 *
 * Кладётся в body с position:fixed, а не рядом с самим значком: у плитки файла
 * имя обрезается по ширине через overflow:hidden, и подсказка из неё была бы
 * срезана вместе с ним.
 */
const TIP_WAIT = 110;             /* мс до появления; глазу это уже «сразу» */
let tip_box = null, tip_timer = 0, tip_at = null;

function tip_hide() {
  clearTimeout(tip_timer);
  tip_at = null;
  if (tip_box) tip_box.classList.remove('on');
}

function tip_show(el) {
  const text = el.getAttribute('data-tip');
  if (!text) return;
  if (!tip_box) {
    tip_box = document.createElement('div');
    tip_box.className = 'tip';
    document.body.appendChild(tip_box);
  }
  tip_box.textContent = text;
  tip_box.classList.add('on');

  /* Разместить можно только после того, как узел получил размеры, — иначе
     ширину не с чем сравнивать и подсказка вылезет за край окна. */
  const r = el.getBoundingClientRect(), b = tip_box.getBoundingClientRect();
  const pad = 6;
  let x = r.left + r.width / 2 - b.width / 2;
  x = Math.max(pad, Math.min(x, innerWidth - b.width - pad));
  /* Снизу, а если там не помещается — сверху. */
  const below = r.bottom + pad;
  const y = below + b.height < innerHeight ? below : r.top - b.height - pad;
  tip_box.style.left = x + 'px';
  tip_box.style.top  = Math.max(pad, y) + 'px';
}

addEventListener('mouseover', e => {
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (!el || el === tip_at) return;
  clearTimeout(tip_timer);
  tip_at = el;
  /* Пока одна подсказка видна, соседняя показывается сразу: ожидание нужно
     против случайного пролёта мышью, а не против перехода между значками. */
  const wait = tip_box && tip_box.classList.contains('on') ? 0 : TIP_WAIT;
  tip_timer = setTimeout(() => tip_show(el), wait);
});
addEventListener('mouseout', e => {
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (el && el === tip_at) tip_hide();
});
/* Подсказка не должна пережить ни щелчок, ни прокрутку, ни начало переноса:
   во всех трёх случаях она уже описывает не то, что под указателем. */
for (const ev of ['mousedown', 'scroll', 'dragstart', 'keydown'])
  addEventListener(ev, tip_hide, true);

/* Страховка от залипшей подсветки: dragend приходит на ИСХОДНУЮ плитку, а её
 * может не стать прямо во время перетаскивания — «hide empty» перерисует сетку,
 * и обработчику будет некуда прийти. Тогда плитки так и остались бы
 * приглушёнными до перезагрузки. */
for (const ev of ['dragend', 'drop'])
  addEventListener(ev, () => {
    if (st.from || st.drag || st.gaps.size || st.showgaps) {
      st.from = 0; st.drag = 0; st.showgaps = false; st.gaps.clear(); bump();
    }
  });

/* Закрытая вкладка теряет отложенное: файлы и правки живут в памяти, и заводить
 * второе хранилище ради этого — заводить второй источник правды. */
addEventListener('beforeunload', ev => {
  if (has_changes()) { ev.preventDefault(); ev.returnValue = '' }
});

/* Ctrl+Z, на маке ⌘Z.
 *
 * Слушаем на документе и пропускаем нажатия внутри полей ввода: там своя
 * отмена, браузерная, и перехватывать её значило бы ломать правку метки на
 * полуслове. */
function watch_undo() {
  addEventListener('keydown', e => {
    if (e.key !== 'z' && e.key !== 'Z' && e.key !== 'я' && e.key !== 'Я') return;
    if (!(e.metaKey || e.ctrlKey) || e.altKey) return;
    const el = document.activeElement;
    if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' ||
               el.isContentEditable)) return;
    e.preventDefault();
    if (!undo(toast)) toast(t('nothing to undo'), 'err');
  });
}

function App() {
  const [, force] = useState(0);
  useMemo(() => { bump = () => force(v => v + 1) }, []);

  const boot = async () => {
    /* ПЕРВЫМ ДЕЛОМ — не в сети ли плата.
     *
     * Спрашивается это отдельным вызовом, БЕЗ подписи, и только поэтому
     * работает: у платы в режиме настройки подпись требуется на всё
     * остальное, а секрета человек ещё не знает — его как раз и показывают на
     * том экране. Через /api/info, из-под подписи, плата ответила бы 401,
     * морда показала бы вход, и человек упёрся бы в поле для секрета, которого
     * у него нет.
     *
     * Отказ здесь — обычное дело: у платы в сети этого вызова нет. */
    try {
      const r = await fetch('/api/setup');
      if (r.ok) {
        const d = await r.json();
        if (d.setup) { st.setup = d; bump(); return }
      }
    } catch (e) { /* нет ответа — значит не в настройке */ }

    try {
      await loadInfo();
      /* Снять липкий признак «Вектор трогал привод» ДО первого чтения с диска —
       * и до меток, а не только до каталогов.
       *
       * Признак означает «трогал с тех пор, как его снимали». Снятый здесь, он
       * к концу загрузки отвечает на нужный вопрос: лазила ли машина на диск
       * ПОКА мы читали, то есть не устарело ли уже прочитанное. Снятый позже
       * отвечал бы на бесполезный, а метки успевали бы устареть незамеченными. */
      /* Шапка поднимается СРАЗУ, как только есть сведения о плате, — до чтения
       * диска, а не после.
       *
       * Выигрыш тут во времени: ждать заголовка винта и меток на плате по
       * воздуху — это заметные секунды «соединяемся» при уже известном
       * состоянии привода.
       *
       * Диск и плата — разные вещи, и первое ждать второго не должно. */
      watch_board();
      watch_theme();
      watch_undo();
      bump();

      /* Есть ли что поставить. Отдельно и мягко: сборка без обновления по сети
         отвечает 501, и это не беда, а свойство сборки. */
      try { st.upd = await (await api('/api/update')).json() }
      catch (e) { st.upd = null }

      await post('/api/forget');
      /* Нет разметки -- не ошибка, а новая карта: вместо дискет морда
         предлагает её разметить (InitDisk). */
      try { await loadGeom() }
      catch (e) {
        if (e.message !== NO_LAYOUT) throw e;
        st.no_layout = true; bump(); return;
      }
      st.no_layout = false;
      bump();
      await loadLabels();
      /* Метки приходят одним запросом, поэтому список виден почти сразу.
       * Каталоги читаются следом сами: на плате это 324 обращения по восемь
       * секторов, порядка двух секунд работы диска, и лучше подождать их один
       * раз, чем смотреть на список, в котором не видно, где что лежит. */
      scan_all();
    } catch (e) {
      if (!st.need_login) { toast(e.message, 'err') }
    }
  };

  useEffect(() => { boot() }, []);

  /* Настройка идёт ПЕРЕД входом, и порядок тут не случаен: пока плата не в
     сети, секрета человек ещё не знает — его и показывают на этом экране. */
  if (st.setup) return html`<${Setup}/>`;

  if (st.need_login)
    return html`<${Login} why=${st.toast ? st.toast.text : ''} onDone=${() => {
      st.need_login = false; toast(''); boot();
    }}/>`;

  /* Вкладок нет: показывать нечего, кроме дискет. */
  return html`<div>
    <header><h1>COMBOLITE</h1><${Meta}/><${Board}/><${Radio}/><${Update}/>
      <button class="ask" data-tip=${t('what this can do')} aria-label=${t('help')}
              onClick=${() => { st.help = true; bump() }}>?</button>
      <${ThemePick}/><${LangPick}/></header>
    <${Help}/>
    <main>${st.no_layout ? html`<${InitDisk}/>` : html`<${Floppies}/>`}</main>
    <${PendingBar}/>
    ${/* Щелчком снимается сразу: ждать таймаута, когда уже прочитал, незачем. */
      st.toast && html`<div class=${'toast ' + st.toast.kind}
        onClick=${() => toast('')}>${st.toast.text}</div>`}
  </div>`;
}

/* Ручка для отладки из консоли. Заведена намеренно: морду проверяют сверкой
 * хешей собранных файлов с эталоном, а из модульной области ничего не видно. Ничего сверх того, что и так доступно скрипту на этой
 * странице, она не открывает: ключ сессии лежит в sessionStorage того же
 * источника. */
window.combo = { st, t, t_missing, beak_at, fs_safe, suggest_name, drop_login,
                 dirs, labels, bad, readDir, readBlocks,
                 loadInfo, loadGeom, ask_board,
                 loadLabels, scan_all, sha256, hmac256, tohex, utf8, login, bump,
                 base, parseDir, pending, stage, apply_pending, label_sector,
                 label_of, LAB_OFF, Layout, FitError, split_name, build_entry,
                 dir_stats, entry_kind, DIR_SECS, MIN_BLK, MAX_BLK, PAD,
                 dirRaw, projected, staged_bytes, proj, cat_of, has_changes,
                 stage_add, stage_remove, drop_changes, take_files, suggest_name,
                 write_runs, readDir };

wear_theme();
render(html`<${App}/>`, document.getElementById('app'));
</script>
