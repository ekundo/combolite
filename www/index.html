<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COMBOLITE</title>
<style>
/* Две палитры.
 *
 * Цвета названы по РОЛИ, а не по виду: «--sel» это «выбранное», а не «синеватый
 * тёмный». Пока роль одна, светлая тема сводится ко второму набору чисел, и
 * менять правила не приходится ни одного.
 *
 * Тёмная — основная: за ней сидят по вечерам, и «Вектор» на столе светит
 * зелёным. Светлая берётся, когда так настроена система, или по щелчку.
 */
:root {
  --bg:#12151a; --panel:#1a1f27; --line:#2b323d; --ink:#d7dde6; --dim:#8b95a3;
  --acc:#6ea8fe; --warn:#e0a34a; --err:#e06c75; --ok:#88c07a;

  --sel:#1e2734;      /* выбранное и подсвеченное: фон с оттенком акцента */
  --okbg:#18231a;     /* то же, но зелёным: находка, цель броска */
  --sunk:#161b22;     /* раскрытая панель — чуть глубже общего фона */
  --float:#232a35;    /* то, что висит поверх: всплывашка, подсказка */
  --pend:#1b2330;     /* строка непринятых изменений */
  --field:#0b0e13;    /* поле ввода */
  --onacc:#0b0e13;    /* текст на залитой кнопке */
  --veil:#0008;       /* затемнение под справкой */
  --shadow:#0009;     /* тень у всего, что висит */
}

:root[data-theme="light"] {
  --bg:#f2f5f9; --panel:#ffffff; --line:#d3dae4; --ink:#1b2430; --dim:#5d6b7c;
  /* Акценты пришлось приглушить: те же на белом слепят и теряют читаемость. */
  --acc:#1f6feb; --warn:#9a5b00; --err:#b3261e; --ok:#2e7d32;

  --sel:#e6efff;
  --okbg:#e9f5ea;
  --sunk:#fbfcfe;
  --float:#ffffff;
  --pend:#eaf1fc;
  --field:#ffffff;
  --onacc:#ffffff;
  --veil:#1b243066;
  --shadow:#1b243026;
}
* { box-sizing:border-box }
body { margin:0; background:var(--bg); color:var(--ink);
       font:14px/1.45 -apple-system,Segoe UI,Roboto,sans-serif }
/* По центру, а не по базовой линии: в строке стоят не только слова, но и
   плашки с переключателем, и ровняются они друг с другом коробками. */
header { display:flex; gap:1.5rem; align-items:center; flex-wrap:wrap;
         padding:.7rem 1rem; background:var(--panel); border-bottom:1px solid var(--line) }
/* Название ростом с плашкой состояния — но по её ВНУТРЕННЕМУ полю, 20.6 точки,
   а не по внешнему с рамкой: рамка это граница, а не буква, и слово, дотянутое
   до неё, кажется вылезающим наружу. У этого шрифта заглавная занимает 0.762
   кегля, отсюда и кегль — 27.
   Сдвиг: слово набрано прописными, а у них нет выносных элементов вниз, и по
   середине бокса оно встаёт чуть выше середины плашек. Величина в em, чтобы
   держаться за кегль, а не за точки; оба числа проверены измерением в браузере
   через actualBoundingBox, а не на глаз. */
h1 { font-size:27px; line-height:1; margin:0; letter-spacing:.08em;
     position:relative; top:.009em }
/* Версия у названия. Отрицательный отступ слева съедает промежуток шапки: она
   подпись к названию, а не отдельный житель строки. Моноширинная — её
   сверяют посимвольно с тем, что написано в раздаче. */
/* Версия — у правого края строки итога. margin-left:auto разводит их по краям
   строки, не заводя ради этого лишней обёртки. */
.scan .ver { float:right; color:var(--dim); font-size:11px;
             font-family:ui-monospace,SFMono-Regular,Menlo,monospace }
.meta { color:var(--dim); font-size:13px; display:flex; gap:.5rem; flex-wrap:wrap;
        align-items:center }
.meta b { color:var(--ink); font-weight:600 }
/* Показатели в шапке: точка и слово, один вид на оба. Точка несёт состояние
   цветом, слово — словом; поодиночке первая нечитаема дальтоником, второе
   теряется в строке. Один вид на оба — потому что говорят они об одном: в
   каком состоянии плата.

   Не inline-flex: у него базовая линия берётся от ПЕРВОГО вложенного, а первая
   тут точка без текста — и заголовок в шапке вставал выше подписей. */
.pill { display:inline-block; padding:.1rem .45rem; border-radius:3px;
        font-size:12px; border:1px solid var(--line);
        background:none; font:inherit; color:var(--dim) }
.pill::before { content:''; display:inline-block; width:.42rem; height:.42rem;
                border-radius:50%; background:currentColor;
                margin-right:.35rem; vertical-align:.06em }
.pill.ok   { color:var(--ok) }
.pill.warn { color:var(--warn) }
.pill.bad  { color:var(--err) }
button.pill { cursor:pointer }
button.pill:hover { border-color:currentColor }
/* Показатель сети — своя всплывашка, но живёт в том же ряду, что и привод.
   Без отдельного отступа: .meta уже разделены общим промежутком шапки. */
/* position НЕ переопределяем: у .meta он relative, и всплывашка отсчитывается
   от своей плашки — правым краем вровень с ней, как и задумано. С
   position:static она отсчитывалась бы от body, то есть уезжала бы под
   страницу: в DOM она есть, на экране её нет. */
.meta.radio, .meta.wide-pop { margin-left:0 }
/* Подробности о приводе: раскрываются щелчком по показателю. Не подсказкой —
   подсказку не прочесть на телефоне и не выделить мышью. */
.meta { position:relative }
.pop { position:absolute; top:100%; left:0; margin-top:.4rem; z-index:5;
       background:var(--panel); border:1px solid var(--line); border-radius:5px;
       padding:.5rem .7rem; display:grid; gap:.25rem; white-space:nowrap;
       box-shadow:0 8px 24px var(--veil) }
.pop > div { display:flex; gap:1rem; justify-content:space-between }
/* Всплывашка сети растёт под свой текст, а не под кнопки.
 *
 * Общая .pop шириной по содержимому, то есть по двум кнопкам, и строки обзора
 * эфира в неё не помещаются. Растём под текст, но не шире экрана,
 * и раскрываемся ВЛЕВО: плашка стоит в правой половине шапки, и всплывашка от
 * её левого края ушла бы за край окна. */
/* Всплывашка сети висит ПОД СВОЕЙ ПЛАШКОЙ, правым краем вровень с ней, и
   растёт влево. Привязка к шапке надёжнее — окно наверняка влезает, — но
   у правого края, за две плашки от своей, оно читается как ничьё.
   Упереться в край экрана ей не даёт подвижка в usePop: ширину текста CSS не
   знает, а измерить её можно. Правило общее для всех широких коробочек —
   сети и обновления: писать его заново для каждой новой значит однажды
   забыть. */
.radio .pop, .wide-pop .pop { left:auto; right:0; width:max-content;
                              max-width:calc(100vw - 2rem) }
/* Пояснение внутри коробочки ПЕРЕНОСИТСЯ. У .pop стоит nowrap — он верен для
   строк вида «объём … 248.5 MB», где перенос посреди значения выглядел бы
   поломкой, — но абзац от него растягивался в одну строку на всю ширину окна.
   Ширина взята по длине удобной строки, а не по месту на экране. */
.pop .note { white-space:normal; max-width:24rem; margin:.4rem 0 0 }
/* Раскрытая плашка обведена своим цветом: видно, чья это коробочка. */
.pill.on { border-color:currentColor }
/* Колода под курсором при переносе пачки. Уводится за край экрана: она нужна
   браузеру ровно на миг снимка, а на странице ей не место. Карты — копии
   настоящих плиток, разложенные лесенкой; левый верхний угол пустой, там
   курсор. */
.ghost { position:fixed; top:-999px; left:-999px }
.ghost > .ftile { position:absolute; margin:0; opacity:.95;
                  box-shadow:0 2px 6px var(--veil) }

/* Ответы платы своими словами: обзор эфира и журнал. Моноширинный шрифт не
   украшение — в обзоре столбцы, а в журнале отступы, и пропорциональный их
   разваливает. Перенос строк запрещён по той же причине; вместо него полоса
   прокрутки, а высота ограничена, чтобы журнал не выпихивал кнопки с экрана. */
.pop .asks { display:flex; gap:.4rem; margin-top:.4rem }
.pop .asks button { flex:1; font:inherit; padding:.2rem .5rem; cursor:pointer;
       background:var(--bg); color:inherit; border:1px solid var(--line);
       border-radius:4px }
.pop .asks button:hover { border-color:var(--dim) }
.said { margin:.4rem 0 0; padding:.4rem; max-height:14rem; overflow:auto; background:var(--bg); border:1px solid var(--line);
       border-radius:4px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
       font-size:.8rem; line-height:1.35; white-space:pre }
.pop span { color:var(--dim) }
/* Плата: узлы ПЛИС. Разделы -- подписями, как в справке; флажки и списки --
   строками всплывашки. */
.board .pop h4 { font-size:11px; font-weight:600; color:var(--acc); margin:.6rem 0 .25rem;
                 text-transform:uppercase; letter-spacing:.06em }
.board .pop h4:first-child { margin-top:0 }
.board .pop .chk { display:flex; flex-direction:row; gap:.45rem; align-items:center;
                   color:var(--ink); font-size:13px; cursor:pointer; justify-content:flex-start }
.board .pop .chk input { margin:0 }
.board .pop select { font:inherit; padding:0 .2rem }
.pop .note.bad { color:var(--err) }
/* Экран машины: 256x256 точек, а на экране «Вектора» они растянуты до 4:3. */
.help.screen { max-width:40rem }
.help.screen .hhead .sm + .sm { margin-left:0 }
.help.screen canvas { display:block; width:100%; aspect-ratio:4/3; margin-top:.4rem;
                      image-rendering:pixelated; background:var(--bg) }
/* Корзина архива. Прижата к правому краю шапки: она про весь диск, а не про
   то, что рядом. */
/* Корзина стоит в строке поиска, у правого края, и ростом с само поле: рядом
   с ним она и живёт. */
.basket { position:relative; margin-left:auto }
/* Знак вопроса у правого края, перед языком: справку зовут редко, и место ей
   там же, где прочее «про морду вообще», а не «про этот диск». */
.ask { margin-left:auto; width:1.6rem; height:1.6rem; border-radius:50%;
       background:none; color:var(--dim); font:inherit; font-size:13px;
       font-weight:600; border:1px solid var(--line); cursor:pointer;
       display:flex; align-items:center; justify-content:center }
.ask:hover { color:var(--acc); border-color:var(--acc) }
/* Знак вопроса и выбор языка стоят вместе у правого края: и то, и другое про
   морду вообще, а не про этот диск. Отступ между ними меньше общего в шапке —
   так они читаются одной группой, а не двумя одиночками.

   Прижимает группу к краю ОДИН margin-left:auto, на первом из них. На обоих
   свободное место делилось бы между ними пополам, и «?» уезжал бы в середину
   строки. */
header > .lang { margin-left:.5rem }
.lang.theme .lng { padding:.14rem .4rem; line-height:0 }
.lang.theme .lng svg { display:block; width:1rem; height:1rem }
/* Справка поверх всего и на всю высоту: её читают, а не подглядывают краем
   глаза, и подстраивать под неё раскладку незачем. */
.veil { position:fixed; inset:0; z-index:30; background:var(--veil);
        display:flex; align-items:flex-start; justify-content:center;
        padding:3vh 1rem; overflow:auto }
.help { background:var(--panel); border:1px solid var(--line); border-radius:6px;
        padding:1rem 1.2rem 1.2rem; max-width:52rem; width:100% }
.help .hhead { display:flex; align-items:center; gap:1rem; margin-bottom:.4rem }
.help .hhead b { font-size:15px }
.help .hhead .sm { margin-left:auto }
.help h3 { font-size:12px; font-weight:600; color:var(--acc); margin:1.1rem 0 .4rem;
           text-transform:uppercase; letter-spacing:.06em }
.help .hrow { display:flex; gap:1rem; padding:.22rem 0; font-size:13px;
              align-items:baseline }
.help .hrow b { flex:0 0 15rem; color:var(--ink); font-weight:500 }
.help .hrow span { color:var(--dim) }
@media (max-width:52rem) {
  .help .hrow { flex-direction:column; gap:.1rem; padding:.35rem 0 }
  .help .hrow b { flex:none }
}
/* Переключатель языка прижат к правому краю шапки. */
header > .lang { align-items:center }
/* Два переключателя впритык, как одна кнопка из двух половин: так видно, что
   выбор один из двух, а не две отдельные кнопки. */
.lang { display:flex }
/* Рост и отступы — как у плашек состояния слева: они стоят в одной строке, и
   разнобой там заметнее всего. */
.lng { background:none; border:1px solid var(--line); cursor:pointer;
       color:var(--dim); font:inherit; font-size:12px; font-weight:600;
       padding:.1rem .45rem; min-width:2.1rem }
.lng:first-child { border-radius:4px 0 0 4px }
.lng:last-child  { border-radius:0 4px 4px 0; margin-left:-1px }
.lng:hover { color:var(--ink); border-color:var(--acc); position:relative }
.lng.on { color:var(--acc); border-color:var(--acc); background:var(--sel);
          position:relative }
.zip { display:inline-flex; align-items:center; gap:.4rem; cursor:pointer;
       background:none; color:var(--dim); font:inherit;
       border:1px solid var(--line); border-radius:4px; padding:.42rem .7rem }
.zip svg { display:block; width:1.15rem; height:1.15rem }
.zip:hover { color:var(--acc); border-color:var(--acc) }
.zip.full { color:var(--acc) }
.zip.full b { font-size:12px; font-weight:600 }
/* Пунктиром — как у дискеты, на которую несут файл извне. */
.zip.over { color:var(--ok); border-color:var(--ok); border-style:dashed }
/* Вниз, а не вверх: корзина стоит у самого верха страницы, и вверх список
   уходил бы за край окна. Сетку он собой накрывает, но лишь пока раскрыт —
   щелчок мимо его убирает. */
.pop.wide { left:auto; right:0; min-width:26rem; max-height:60vh; overflow:auto;
            white-space:normal }
.pop .row { display:flex; align-items:center; gap:.6rem }
.pop .row .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis;
                white-space:nowrap; font-family:ui-monospace,Menlo,monospace;
                font-size:12px; color:var(--ink) }
.pop .row .act { background:none; border:0; color:var(--dim); cursor:pointer;
                 padding:0; line-height:0; display:flex }
.pop .row .act svg { width:1em; height:1em }
.pop .row .act:hover { color:var(--err) }
.pop .foot { display:flex; align-items:center; gap:.6rem; margin-top:.4rem;
             padding-top:.5rem; border-top:1px solid var(--line) }
.pop .foot .note { margin:0; flex:1 }
.tip { position:fixed; z-index:20; pointer-events:none; opacity:0;
       background:var(--field); color:var(--ink); border:1px solid var(--line);
       border-radius:4px; padding:.28rem .5rem; font-size:12px; max-width:22rem;
       box-shadow:0 6px 18px var(--shadow); transition:opacity .08s ease }
.tip.on { opacity:1 }
[data-tip] { cursor:help }
button[data-tip], select[data-tip], label[data-tip] { cursor:pointer }
.pop b { color:var(--ink); font-weight:500;
         font-family:ui-monospace,Menlo,monospace; font-size:12px }

/* Цвета не «плохо/хорошо», а «осторожно/спокойно»: в режиме записи диск можно
   испортить, в режиме чтения нельзя. Задаются классом .warn или .ok на том же
   .pill, что и у привода. */
main { padding:1rem }
/* Разметка новой карты: панель вместо сетки дискет, пары «подпись -- поле». */
.initdisk { max-width:42rem }
.initdisk > div:not(.asks) { display:flex; gap:.8rem; align-items:center; margin:.35rem 0 }
.initdisk > div > span { min-width:11rem; color:var(--dim) }
.initdisk input[type="number"] { width:7rem }
.pane { display:none } .pane.on { display:block }
/* По центру, а не по нижнему краю: в строке рядом стоят переключатель, поле и
   заметка разной высоты, и выравнивание по низу их разъезжало. */
.bar { display:flex; gap:.9rem; align-items:center; flex-wrap:wrap; margin-bottom:.9rem }
.bar .note { margin:0 }
/* Справа два места: временное сообщение и итог обхода. Итог держится отдельно
   от сообщений — иначе он то и дело затирался бы результатом очередного
   действия, хотя описывает диск, а не действие. */
.scan { color:var(--dim); font-size:13px; margin:.9rem 0 0 }

/* Поиск с лупой внутри поля. Отдельная подпись «find file» не нужна — то же
   самое написано в самом поле, и два раза подряд это лишнее. */
.bar .find { position:relative; flex-direction:row; align-items:center }
.bar .find svg { position:absolute; left:.55rem; width:.9rem; height:.9rem;
                 opacity:.45; pointer-events:none; color:var(--ink) }
.bar .find input[type=search] { width:16rem; padding-left:2rem }

/* Переключатель. Галочка тут не годится: «спрятать пустые» включено с самого
   начала, и галочка читалась бы как «сделано», а не как положение тумблера. */
.sw { display:inline-flex; flex-direction:row; align-items:center; gap:.45rem;
      font-size:13px; color:var(--dim); cursor:pointer; user-select:none }
.sw input { position:absolute; width:1px; height:1px; opacity:0 }
.sw .track { flex:none; width:30px; height:17px; border-radius:9px;
             background:var(--bg); border:1px solid var(--line); position:relative;
             transition:background .15s, border-color .15s }
.sw .track i { position:absolute; top:2px; left:2px; width:11px; height:11px;
               border-radius:50%; background:var(--dim);
               transition:transform .15s, background .15s }
.sw input:checked + .track { background:var(--acc); border-color:var(--acc) }
.sw input:checked + .track i { transform:translateX(13px); background:var(--onacc) }
.sw input:focus-visible + .track { outline:2px solid var(--acc); outline-offset:2px }
label { display:flex; flex-direction:column; gap:.2rem; font-size:12px; color:var(--dim) }
label.inline { flex-direction:row; align-items:center; gap:.35rem; font-size:13px }
/* Подписи на кнопках, в выборах и у полей не переносятся: «Add files…» ломалось
   пополам и кнопка вырастала вдвое. Правилом, а не неразрывными пробелами по
   одному, — иначе о них забудут в первой же новой кнопке. */
button, select, label { white-space:nowrap }

/* Фокус рисуем САМИ, одной линией. Браузер кладёт своё кольцо СНАРУЖИ нашей
   рамки, и в поле поиска получалась двойная обводка: наша и его. У всего, что
   с рамкой, фокус меняет её цвет; у значков-кнопок рамки нет — им остаётся
   кольцо, иначе с клавиатуры не видно, где ты. */
:focus { outline:none }
input:focus, select:focus, textarea:focus,
button.sm:focus-visible, button.go:focus-visible,
.lng:focus-visible, .pill:focus-visible,
.zip:focus-visible { border-color:var(--acc) }
.act:focus-visible { outline:1px solid var(--acc); outline-offset:1px;
                     border-radius:2px }

input, select { background:var(--panel); color:var(--ink); border:1px solid var(--line);
                border-radius:4px; padding:.35rem .5rem; font:inherit }
input[type=number] { width:9.5rem }
input[type=search] { width:11rem }
button.go { background:var(--acc); color:var(--onacc); border:0; border-radius:4px;
            padding:.42rem .9rem; cursor:pointer; font:inherit; font-weight:600 }
button.go[disabled] { opacity:.45; cursor:default }
button.sm { background:var(--panel); color:var(--ink); border:1px solid var(--line);
            border-radius:4px; padding:.35rem .6rem; cursor:pointer; font:inherit }

  for (let o = 0; o < total; o += 64) {
    for (let i = 0; i < 16; i++)
      w[i] = (m[o+i*4] << 24) | (m[o+i*4+1] << 16) | (m[o+i*4+2] << 8) | m[o+i*4+3];
    for (let i = 16; i < 64; i++) {
      const s0 = rr(w[i-15],7) ^ rr(w[i-15],18) ^ (w[i-15] >>> 3);
      const s1 = rr(w[i-2],17) ^ rr(w[i-2],19) ^ (w[i-2] >>> 10);
      w[i] = (w[i-16] + s0 + w[i-7] + s1) >>> 0;
    }
    let [a,b,c,d,e,f,g,hh] = h;
    for (let i = 0; i < 64; i++) {
      const S1 = rr(e,6) ^ rr(e,11) ^ rr(e,25);
      const ch = (e & f) ^ (~e & g);
      const t1 = (hh + S1 + ch + K256[i] + w[i]) >>> 0;
      const S0 = rr(a,2) ^ rr(a,13) ^ rr(a,22);
      const mj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + mj) >>> 0;
      hh = g; g = f; f = e; e = (d + t1) >>> 0;
      d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    h[0]=(h[0]+a)>>>0; h[1]=(h[1]+b)>>>0; h[2]=(h[2]+c)>>>0; h[3]=(h[3]+d)>>>0;
    h[4]=(h[4]+e)>>>0; h[5]=(h[5]+f)>>>0; h[6]=(h[6]+g)>>>0; h[7]=(h[7]+hh)>>>0;
  }
  const out = new Uint8Array(32);
  for (let i = 0; i < 8; i++) {
    out[i*4] = h[i] >>> 24; out[i*4+1] = (h[i] >>> 16) & 255;
    out[i*4+2] = (h[i] >>> 8) & 255; out[i*4+3] = h[i] & 255;
  }
  return out;
}

function hmac256(key, msg) {
  let k = key;
  if (k.length > 64) k = sha256(k);
  const pad = new Uint8Array(64);
  pad.set(k);
  const ip = new Uint8Array(64 + msg.length), op = new Uint8Array(64 + 32);
  for (let i = 0; i < 64; i++) { ip[i] = pad[i] ^ 0x36; op[i] = pad[i] ^ 0x5c; }
  ip.set(msg, 64);
  op.set(sha256(ip), 64);
  return sha256(op);
}

const utf8   = s => new TextEncoder().encode(s);
const tohex  = u => Array.from(u, b => b.toString(16).padStart(2, '0')).join('');
const unhex  = s => new Uint8Array(s.match(/../g).map(b => parseInt(b, 16)));
const EMPTY_HASH = tohex(sha256(new Uint8Array(0)));

/* Ключ сессии живёт в sessionStorage: своя копия на вкладку, стирается при
 * закрытии. Сам секрет не хранится нигде — он нужен один раз, при входе. */
const sess = {
  get key()   { const v = sessionStorage.getItem('combo.key');   return v ? unhex(v) : null },
  get nonce() { return sessionStorage.getItem('combo.nonce') },
  get seq()   { return +(sessionStorage.getItem('combo.seq') || 0) },
  set seq(v)  { sessionStorage.setItem('combo.seq', String(v)) },
  save(nonce, key) {
    sessionStorage.setItem('combo.nonce', nonce);
    sessionStorage.setItem('combo.key', tohex(key));
    sessionStorage.setItem('combo.seq', '0');
  },
  drop() { ['key', 'nonce', 'seq'].forEach(k => sessionStorage.removeItem('combo.' + k)) }
};

async function login(secret) {
  const r = await fetch('/api/challenge');
  if (r.status === 404) return false;              // проверка выключена
  if (!r.ok) throw new Error('challenge failed: ' + r.status);
  const nonce = (await r.json()).nonce;
  sess.save(nonce, hmac256(utf8(secret), unhex(nonce)));
  return true;
}

/* Заголовки подписи для одного запроса. Тело — Uint8Array или пусто. */
function signed(method, path, body) {
  const key = sess.key;
  if (!key) return null;
  const seq = sess.seq + 1;
  sess.seq = seq;
  const bh = body && body.length ? tohex(sha256(body)) : EMPTY_HASH;
  const msg = [sess.nonce, seq, method, path, bh].join('\n');
  return { 'X-Combo-Nonce': sess.nonce, 'X-Combo-Seq': String(seq),
           'X-Combo-Mac': tohex(hmac256(key, utf8(msg))) };
}

function text(bytes, enc) {
  if (enc === 'latin')
    return Array.from(bytes, b => (b >= 32 && b < 127) ? String.fromCharCode(b) : '.').join('');
  const s = new TextDecoder(enc).decode(bytes);
  return Array.from(s, (c, i) => bytes[i] < 32 || bytes[i] === 127 ? '.' : c).join('');
}

/* Сбрасывать ли вход по этому отказу. Отдельной функцией, чтобы её можно было
   проверить саму по себе, без всего пути входа. */
const drop_login = (status, was, now) =>
  (status === 401 || status === 429) && was === now;

async function api(path, opts) {
  const o = opts || {};
  const method = o.method || 'GET';
  /* Подпись считается на КАЖДЫЙ запрос: она покрывает метод, путь с запросом и
     хеш тела, поэтому переиспользовать её нельзя, в том числе и нам. */
  const h = signed(method, path, o.body) || {};
  /* Чьей сессией подписан ЭТОТ запрос. Понадобится, когда ответ вернётся: к
     тому времени сессия может смениться. */
  const was = sess.nonce;
  const r = await fetch(path, { method, body: o.body, headers: h });
  if (!r.ok) {
    let why = r.statusText;
    try { why = (await r.json()).error || why } catch (e) {}
    /* ОТКАЗ СБРАСЫВАЕТ ВХОД, ТОЛЬКО ЕСЛИ ОН ПРО НЫНЕШНЮЮ СЕССИЮ.
     *
     * Плата после обновления перезагружается, и прежний вызов-ответ умирает
     * вместе с ней. Запросы, ушедшие до этого — опрос состояния, чтение
     * каталогов, — возвращаются с 401 уже ПОСЛЕ того, как человек вошёл
     * заново, и без этой проверки сбрасывали бы свежий вход: входишь, видишь
     * диск, тебя выбрасывает на логин, и так по кругу, пока запоздавшие ответы
     * не кончатся.
     *
     * Сравнение по вызову отвечает ровно на нужный вопрос: этот отказ про ту
     * сессию, что у нас сейчас, или про давно умершую. */
    if (drop_login(r.status, was, sess.nonce)) {
      sess.drop();
      st.need_login = true;
      bump();
    }
    throw new Error(r.status + ': ' + why);
  }
  return r;
}
const bytes = async path => new Uint8Array(await (await api(path)).arrayBuffer());
const put  = (path, body) => api(path, { method: 'PUT', body });
const post = async (path) => {
  try { return [(await api(path, { method: 'POST' })).status] }
  catch (e) { return [+String(e.message).split(':')[0] || 0] }
};

/* ------------------------------------------------------------ окно записи
 *
 * Плата поднимается ЗАПЕРТОЙ: API отказывает в записи, пока не попросишь
 * разрешения, и оно истекает само через write_window секунд.
 *
 * Морда берёт его РОВНО НА ВРЕМЯ ЗАПИСИ — отпирает перед первым сектором и
 * запирает после последнего. Человеку этого не видно, и правильно: намерение
 * он уже высказал, нажав «Применить», а спрашивать дважды об одном — не
 * осторожность, а мелочность.
 *
 * Разрешение на всю сессию с переключателем в шапке не годится: включил — и
 * плата открыта на запись минутами вместо секунд, до закрытия вкладки, а «не
 * забудь выключить» — правило, которого никто не помнит. Механизм, которому
 * нечего забывать, лучше правила, которое надо помнить.
 *
 * Само окно при этом остаётся страховкой, а не украшением: оборвись связь или
 * закройся вкладка посреди записи — запереть будет некому, и плата сделает это
 * сама, когда время выйдет.
 */
let win_at = 0;                        /* когда взяли окно, мс от начала счёта */

const can_write = () => !!info && !info.read_only;

/* Взять окно. Зовётся и повторно, посреди долгой работы: перестановка идёт
 * секундами, и закрыться посередине — значит оставить диск наполовину
 * переписанным. */
async function take_window(say) {
  if (!info.write_window) return true;          /* окна не требуется вовсе */
  const [code] = await post('/api/unlock');
  if (code !== 202) { say(t('unlock failed: %1', code), 'err'); return false }
  win_at = Date.now();
  info = { ...info, write_left: info.write_window };
  return true;
}

/* Продлить, если до конца окна осталось меньше запаса. Тридцать секунд —
 * с большим запасом на один диск: он переписывается меньше чем за десять. */
const window_soon = () =>
  !!info.write_window && Date.now() - win_at > (info.write_window - 30) * 1000;

async function drop_window() {
  await post('/api/lock');
  info = { ...info, write_left: 0 };
}

const WATCH_MS = 5000;
let watch_timer = 0;

/* Что из сведений о плате ВИДНО на странице. По этой строке фоновый опрос
 * решает, перерисовывать ли: сведения приходят каждые пять секунд, и дёргать
 * отрисовку ради неизменившегося незачем.
 *
 * ВЕРСИЯ ТУТ ОБЯЗАТЕЛЬНА, и это не мелочь. Она видна в подвале и, главное,
 * решает судьбу плашки обновления: плашки нет, когда версия в раздаче совпала
 * с работающей. Без версии в этой строке плата обновилась бы, сведения пришли
 * бы новые, а страница осталась бы прежней — и плашка висела бы, уверяя, что
 * обновление не поставилось, пока что-нибудь другое не вызовет отрисовку. */
function shown_state() {
  return info ? `${info.read_only}|${info.drive}|${info.vector_touched}|` +
                `${info.version}` : '';
}

async function ask_board() {
  if (!info || (typeof document === 'object' && document.hidden)) return;
  let fresh;
  try { fresh = await (await api('/api/info')).json() }
  catch { return }                     /* сеть моргнула — спросим в другой раз */
  const was = shown_state();
  info = fresh;
  if (shown_state() !== was) bump();
}

function watch_board() {
  clearInterval(watch_timer);
  watch_timer = setInterval(ask_board, WATCH_MS);
  /* На document, а не на window: событие рождается у документа, и слушать его
     у окна — полагаться на всплытие там, где оно ни к чему. */
  document.addEventListener('visibilitychange',
                            () => { if (!document.hidden) ask_board() });
}

let info = null, geom = null;
const dirs   = new Map();   // номер дискеты -> разобранный каталог
const labels = new Map();   // номер дискеты -> метка, пустая строка — метки нет
const bad    = new Map();   // номер дискеты -> почему не прочиталась

/* ---------------------------------------------------------------- сведения */
async function loadInfo() {
  info = await (await api('/api/info')).json();
}

/* Заголовок винта: физика и число дискет. Число не зашиваем — оттуда же его
 * читает при старте и сама система. */
const NO_LAYOUT = 'header has no floppy layout';
async function loadGeom() {
  const s = await bytes('/api/sectors/0');
  const w = o => s[o] | (s[o + 1] << 8);
  geom = { spt: s[0x80], heads: s[0x81], cyls: w(0x82) + 1, floppies: w(0x84) };
  if (!geom.floppies || base(geom.floppies) >= info.sectors)
    throw new Error(NO_LAYOUT);
  return geom;
}

/* ---------------------------------------------------------------- каталог */
/* Сырые байты каталога нужны раскладчику: он правит их, а не разобранный
 * список. Разбор — производная от них, а не наоборот. */
const dirRaw = new Map();

const readDir = async n => {
  const raw = await bytes(`/api/sectors/${base(n)}?count=${DIR_SECS}`);
  dirRaw.set(n, raw);
  return parseDir(raw);
};

/* Блоки файла чаще всего идут подряд — сливаем смежные в один запрос, пока
 * укладываемся в предел сервера. */
async function readBlocks(n, blocks, onStep) {
  const b0 = base(n), lim = info.max_count || 64;
  const parts = [];
  let got = 0;
  for (let i = 0; i < blocks.length; ) {
    let j = i + 1;
    while (j < blocks.length && blocks[j] === blocks[j - 1] + 1 &&
           (j - i + 1) * BLK_SECS <= lim) j++;
    parts.push(await bytes(
      `/api/sectors/${b0 + blocks[i] * BLK_SECS}?count=${(j - i) * BLK_SECS}`));
    got += j - i;
    i = j;
    if (onStep) onStep(got, blocks.length);
  }
  const all = new Uint8Array(parts.reduce((s, p) => s + p.length, 0));
  let o = 0;
  for (const p of parts) { all.set(p, o); o += p.length; }
  return all;
}

/* ------------------------------------------------------------------ метки */
async function loadLabels() {
  const N = geom.floppies, len = LAB_SIGN.length + LAB_LEN;
  const per = Math.max(1, Math.floor((info.scan_bytes || 32768) / len));
  for (let first = 1; first <= N; first += per) {
    const cnt = Math.min(per, N - first + 1);
    const buf = await bytes(`/api/scan?start=${base(first) + LAB_OFF}` +
                            `&stride=${FLOPPY}&count=${cnt}&len=${len}`);
    for (let i = 0; i < cnt; i++)
      labels.set(first + i, decodeLabel(buf.subarray(i * len, (i + 1) * len)));
    bump();
  }
}


/* ---------------------------------------------------------------- состояние
 *
 * Изменяемые Map плюс счётчик перерисовок, а не неизменяемое состояние. Довод
 * прикладной: обход правит dirs триста с лишним раз, и копировать её на каждое
 * движение значило бы копировать зря. Перерисовку заказывает bump().
 *
 * Всё, что зависит от диска (info, geom, dirs, labels, bad), лежит в модуле, а
 * не в состоянии составной части: его читают и обход, и загрузка, и панель, и
 * тащить это через свойства было бы длиннее, чем польза.
 */
/* Привычки показа переживают перезагрузку страницы: порядок файлов и показ
 * пустых дискет человек настраивает под себя один раз, а не каждый заход. В
 * localStorage — не в sessionStorage: настройка не про сессию, и не на плате —
 * она про этот браузер, а не про этот винт.
 *
 * Всё через try: приватное окно и запрет на данные сайта бросают на самом
 * ОБРАЩЕНИИ к хранилищу, а не при записи, и без обёртки страница не поднялась
 * бы вовсе. */
const PREF = 'combolite.';
const pref_get = (k, dflt) => {
  try { const v = localStorage.getItem(PREF + k); return v === null ? dflt : v }
  catch { return dflt }
};
const pref_set = (k, v) => { try { localStorage.setItem(PREF + k, String(v)) } catch {} };

/* Язык. По умолчанию — тот, на котором говорит браузер: «Вектористы» чаще
 * читают по-русски, и заставлять их каждый раз переключать незачем. Выбор
 * запоминается наравне с прочими привычками показа. */
const lang_default = () =>
  (typeof navigator === 'object' && /^ru\b/i.test(navigator.language || '')) ? 'ru' : 'en';
const lang_saved = pref_get('lang', '');

/* Тема. По умолчанию та, что просит система; выбор запоминается, как язык.
 * Пока выбора не было, морда следует за системой и дальше — оттого слушатель:
 * переключили тему в системе, и здесь тоже. */
const THEMES = ['dark', 'light'];
const theme_saved = pref_get('theme', '');
const asks_light = () => {
  try { return matchMedia('(prefers-color-scheme: light)').matches } catch { return false }
};
const theme_default = () => asks_light() ? 'light' : 'dark';

function wear_theme() {
  /* Тёмная — основная, и метку для неё не ставим: правила без метки её и
     описывают. Так морда одета правильно ещё до того, как выполнится скрипт. */
  const el = document.documentElement;
  if (st.theme === 'light') el.dataset.theme = 'light';
  else delete el.dataset.theme;
}

function watch_theme() {
  if (theme_saved) return;             /* выбрали руками — система не указ */
  try {
    matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
      if (pref_get('theme', '')) return;
      st.theme = theme_default(); wear_theme(); bump();
    });
  } catch { /* старый браузер — обойдёмся без слежения */ }
}

/* Перевод. Ключ — сама английская строка, подстановки нумерованные; почему
 * так — см. www/i18n.mjs.
 *
 * Ненайденное запоминается: по этому списку проверка на полноту и понимает,
 * что перевод отстал от текста. Возвращается при этом английский — лучше
 * чужое слово, чем пустое место. */
const t_missing = new Set();
function t(en, ...a) {
  let out = en;
  if (st.lang !== 'en') {
    const d = st.lang === 'ru' ? RU : null;
    if (d && d[en] !== undefined) out = d[en];
    else t_missing.add(en);
  }
  return a.length ? out.replace(/%(\d)/g, (_, i) => a[i - 1]) : out;
}

/* Отказ раскладчика и разбора образа — по-русски. Готовую строку перевести уже
 * нечем, поэтому они несут ключ и подставленное отдельно, см. www/disk.mjs;
 * число со словом складывается здесь, потому что форм по-русски три. */
const why = e => e.key
  ? t(e.key, ...e.args.map(a =>
      a && a.one !== undefined ? plural(a.n, a.one, a.many) : a))
  /* 409 приходит, когда «Вектор» сам сел на привод: плата в этот момент не
     пишет вовсе. Это не сбой, а занятость, и человеку надо сказать именно так —
     «повторите», а не «ошибка 409». Текст платы («the Vector is using the drive
     right now») по-английски и без перевода, поэтому подставляем свой. */
  : /^409\b/.test(String(e.message))
    ? t('the Vector is working with the disk — try again in a moment')
    : e.message;

const st = { theme: THEMES.includes(theme_saved) ? theme_saved : theme_default(),
             lang: LANGS[lang_saved] ? lang_saved : lang_default(),
             open: 0, hide: pref_get('hide', '1') !== '0', find: '', msg: '', note: '',
             need_login: false, drag: 0, from: 0, scanning: false,
             /* Плата не в сети и ждёт указаний: сведения из /api/setup.
                Спрашивается без подписи — см. boot. */
             setup: null,
             /* Что плата знает про выпущенную прошивку: /api/update. */
             upd: null,
             /* Итог обхода — ЧИСЛА, а не сложенная строка: строку складывает
                тот, кто рисует, и она следует за выбранным языком. */
             scan: null,
             /* Разрывы в списке, раскрытые на время перетаскивания: ключ — номер
                дискеты, с которой разрыв начинается. См. Floppies. */
             gaps: new Set(), showgaps: false,
             /* Область, над которой сейчас держат файлы, и области, добавленные
                в панель вручную: их на дискете ещё нет, но положить в них надо. */
             area_drop: -1, areas: new Map(),
             /* Порядок файлов. Один на все дискеты: он про привычку смотреть, а
                не про содержимое конкретной. */
             sort: ['name', 'type', 'size'].includes(pref_get('sort', 'name'))
                     ? pref_get('sort', 'name') : 'name',
             /* Итог последнего действия. Живёт секунды и уходит сам, см. toast. */
             toast: null,
             /* Выделение файлов в открытой панели: ключи «область:имя».
                Живёт в общем состоянии, а не в панели, потому что за него
                держится и перетаскивание, и подсветка плитки-приёмника. */
             help: false,
             sel: new Set(), anchor: '', dragging_files: 0 };
let bump = () => {};

/* --------------------------------------------------------------- всплывашка
 *
 * Итог действия — не часть панели: он живёт секунды и уходит сам. В строке
 * органов управления ему не место, там он растягивал бы её на несколько строк
 * и висел бы, когда давно устарел.
 *
 * Одна за раз: следующее сообщение вытесняет прежнее. Копить их незачем —
 * действия здесь по одному, и последнее и есть важное.
 */
/* Заглушки разрывов показываются НЕ в обработчике dragstart, а тактом позже.
 *
 * Это не украшение, а обход настоящей беды. Появление заглушки перекладывает
 * сетку, и если перекладка случается прямо в обработчике dragstart, браузер
 * отменяет начатое перетаскивание: сразу за dragstart приходит dragend, а ни
 * одного drag между ними нет. Проверено мышью — с дискеты 48, перед которой
 * лежит разрыв 40..47, было не стронуться, а с 39-й, перед которой заглушек
 * нет, всё работало.
 *
 * Тактом позже перетаскивание уже началось, и перекладка ему не страшна — так
 * же ведут себя и обычные списки с перестановкой.
 */
function begin_drag() {
  setTimeout(() => { st.showgaps = true; bump() }, 0);
}

let toast_timer = 0;

function toast(text, kind) {
  clearTimeout(toast_timer);
  st.toast = text ? { text, kind: kind || '' } : null;
  /* Отказу времени больше: его читают, а не отмечают краем глаза. */
  if (text) toast_timer = setTimeout(() => { st.toast = null; bump() },
                                     kind === 'err' ? 12000 : 5000);
  bump();
}

/* «1 files» на плитке царапает глаз ровно так же, как царапало «needs 1
 * directory entries» в отказе, — счётчики согласуются с числом. По-русски
 * форм три, и двумя не обойтись: «5 файл» читается как поломка. */
const plural = (k, one, many) =>
  st.lang === 'ru' && RU_FORMS[one]
    ? `${k} ${ru_plural(k, RU_FORMS[one])}`
    : `${k} ${k === 1 ? one : many}`;

/* Номер диска ВСЕГДА шестнадцатеричный: так их зовёт сам «Вектор», и две
 * записи рядом («4» и «4h») только сбивали бы. Десятичных в морде нет нигде —
 * ни на плитке, ни в отказах, ни в имени скачанного образа.
 *
 * И без «h» — тоже везде, и в связной речи: десятичных номеров в морде нет ни
 * одного, путать не с чем, а буква цеплялась бы взглядом в каждой строке. */
const num = n => n.toString(16).toUpperCase();

/* Сотые доли килобайта на плитке никому не нужны, а место занимают: после
 * сотни килобайт дробная часть отбрасывается. */
const kb = n => {
  const k = n / 1024;
  return (k >= 100 ? Math.round(k) : +k.toFixed(1)) + ' KB';
};
const CAP = (MAX_BLK - MIN_BLK + 1) * BLK_SECS * 512;   /* 390 блоков по 2 КБ */

/* Образец вроде "*.COM" или "DIZ?" — как их пишут в самой системе. */
/* Поиск по маске. Регистр не различается: имена в каталоге почти все заглавные,
   но строчные там тоже бывают — и с «Вектора», и от нас, — а человек, набирая
   «*.txt», ищет файл, а не регистр. */
function match(pat, name) {
  const rx = new RegExp('^' + pat.replace(/[.+^${}()|[\]\\]/g, '\\$&')
                                 .replace(/\*/g, '.*').replace(/\?/g, '.') + '$', 'i');
  return rx.test(name);
}

/* ------------------------------------------------------------------- обход */
/* Кнопки «стоп» здесь нет намеренно. Обход это 324 запроса по восемь секторов —
 * полторы секунды на плате и меньше на образе, — и останавливать тут нечего.
 * Если обход всё же
 * застрянет на мёртвом приводе, помогает перезагрузка страницы, а не кнопка. */
async function scan_all() {
  const todo = [];
  for (let n = 1; n <= geom.floppies; n++)
    if (!dirs.has(n) && !bad.has(n)) todo.push(n);
  if (!todo.length) return;

  st.scanning = true;
  const t0 = performance.now();
  let i = 0, done = 0;


  /* Несколько запросов внахлёст: сервер однопоточный, но пока он читает один
   * каталог, следующий уже ждёт в очереди — и время в пути не простаивает.
   * Больше трёх смысла не имеет: соединений у сервера всего восемь. */
  const worker = async () => {
    while (i < todo.length) {
      const n = todo[i++];
      try { dirs.set(n, await readDir(n)) }
      catch (e) { bad.set(n, e.message) }
      if (++done % 8 === 0 || i >= todo.length) {
        st.scan = { done, total: todo.length };
        bump();
      }
    }
  };
  await Promise.all([worker(), worker(), worker()]);

  st.scanning = false;
  st.scan = { done, secs: ((performance.now() - t0) / 1000).toFixed(1) };
  await ask_board();          /* не лазила ли машина, пока мы читали */
  bump();
}

/* Журнал отката чистится после записи и после перечитки: снимки в нём
   описывают состояние, которого больше нет, и «шаг назад» вернул бы правку,
   уже лежащую на диске, — то есть предложил бы записать её второй раз. */

/* Перечитать каталоги заново — по кнопке «Вектор трогал диск».
 *
 * Непринятые правки построены поверх ПРЕЖНЕГО каталога, поэтому молча их
 * пережить перечитка не может: она бы оставила замысел, опирающийся на то, чего
 * на диске уже нет. Отказываем и говорим, что делать. Сверка на Apply поймала
 * бы это и сама, но узнавать о таком после нажатия «применить» обидно. */
async function rescan(say) {
  if (has_changes()) {
    if (say) say(t('apply or discard your changes first'), 'err');
    return false;
  }
  forget_undo();
  await post('/api/forget');
  dirs.clear();
  bad.clear();
  st.scan = null;
  bump();
  await loadLabels();
  await scan_all();
  await ask_board();
  return true;
}

/* --------------------------------------------------------------- скачивание */
function save_blob(data, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], { type: 'application/octet-stream' }));
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

/* Содержимое файла: отложенное, если он ещё не на диске, иначе с диска.
 * Нужно и скачиванию, и переносу на другую дискету — оттого отдельно. */
async function file_bytes(n, f, on_step) {
  const staged = staged_bytes.get(bkey(n, f.user, f.raw));
  if (staged) return staged;
  const raw = await readBlocks(n, f.blocks, on_step);
  /* Последняя запись файла бывает занята не целиком, но CP/M про это не
   * помнит: длина кратна 128 байтам, и это всё, что известно. */
  return raw.subarray(0, f.size);
}

async function download(n, f, say) {
  try {
    const fresh = staged_bytes.has(bkey(n, f.user, f.raw));
    const data = await file_bytes(n, f, (got, all) =>
      say(t('%1: %2 of %3 blocks…', f.name, got, all), 'busy'));
    save_blob(data, fs_safe(f.name));
    say(t('%1: %2 bytes', f.name, f.size.toLocaleString('en')) +
        (fresh ? ' ' + t('(not written yet)') : ''), '');
  } catch (e) {
    say(`${f.name}: ${why(e)}`, 'err');
  }
}

/* ------------------------------------------------- перенос файла на дискету
 *
 * По умолчанию копия, с Shift — перенос. Указатель говорит, что будет: браузер
 * рисует «плюс» или стрелку сам, если правильно выставить dropEffect, и своя
 * подпись у курсора тут не нужна.
 *
 * Область пользователя сохраняется: файл из области 3 приезжает в область 3.
 * Переносить между областями — отдельное дело, тут его нет.
 */
/* Перенос и копирование файлов.
 *
 * to_area задан — файлы кладутся ИМЕННО в эту область пользователя; не задан —
 * каждый остаётся в своей (так работает бросок на плитку другой дискеты).
 *
 * Перенос ВНУТРИ дискеты между областями — особый случай: там нечего читать и
 * нечего перекладывать, область живёт в первом байте записи каталога, и правка
 * ровно в него. Копия внутри дискеты — наоборот, настоящее удвоение блоков:
 * две записи на одни и те же блоки МикроДОС не переживёт, см. Layout.chuser.
 */
/* Перетаскивание файлов. Модификатора нет — правило само по себе:
 *
 *   на ДРУГОЙ диск  — копия. Взять и положить, источник цел; не понравилось —
 *                     выделение никуда не делось, жмите «Удалить выделенное».
 *   между областями ОДНОГО диска — перенос. Копия там означала бы второй
 *                     экземпляр тех же блоков под тем же именем, и никому
 *                     такое не нужно.
 *
 * Shift тут не годится: браузер не передаёт состояние клавиш в события
 * перетаскивания, и человек видел бы копию там, где просил перенос.
 * Правило, которое не нужно держать в пальцах, надёжнее любой клавиши. */
async function move_files(from, to, keys, to_area) {
  /* Весь жест — один шаг отката, а не два: перенос это «положить и убрать», и
     откатывать его половинами было бы хуже, чем не откатывать вовсе. */
  return undoable_async(
    to_area !== undefined && from === to
      ? t('move to user area %1', to_area)
      : t('%1 to disk %2', plural(keys.length, 'file', 'files'), num(to)),
    () => move_files_(from, to, keys, to_area));
}

async function move_files_(from, to, keys, to_area) {
  const same = from === to;
  const want_move = same;
  if (same && to_area === undefined) { toast('same floppy', 'err'); return false }
  if (same && keys.every(k => k.user === to_area)) {
    toast(t('already in user area %1', to_area), 'err'); return false;
  }

  try {
    if (!dirRaw.has(to)) dirs.set(to, await readDir(to));
  } catch (e) { toast(why(e), 'err'); return false }

  /* Перенос между областями одной дискеты: правка байта, без чтения. */
  if (same && want_move) {
    const lay = proj_snapshot(from);
    const errs = [];
    for (const k of keys) {
      try { lay.chuser_raw(k.raw, k.user, to_area) }
      catch (e) {
        const text = why(e);
        errs.push({ name: k.name,
                    why: text.startsWith(k.name)
                           ? text.slice(k.name.length).trim() : text });
      }
    }
    if (errs.length) { toast(batch_why(keys.length, errs), 'err'); return false }
    projected.set(from, lay);
    /* Отложенные байты переезжают вместе с файлом: ключ включает область. */
    for (const k of keys) {
      const was = bkey(from, k.user, k.raw);
      if (staged_bytes.has(was)) {
        staged_bytes.set(bkey(from, to_area, k.raw), staged_bytes.get(was));
        staged_bytes.delete(was);
      }
    }
    /* Тот же пустой след, что и при копировании с удалением: файл, ушедший в
       другую область и вернувшийся, каталог не меняет. */
    settle(from);
    bump();
    toast(t('%1 moved to user area %2 — not written yet',
            plural(keys.length, 'file', 'files'), to_area), 'ok');
    return true;
  }

  /* Читаем ВСЁ до единой правки: обрыв на середине чтения тоже не должен
     оставлять половину пачки уложенной. */
  const items = [];
  try {
    for (const k of keys) {
      const f = (cat_of(from) || []).find(x => x.user === k.user && x.raw === k.raw);
      if (!f) throw new FitError(t('%1 is gone from disk %2', k.name, num(from)));
      toast(`${k.name}: reading…`, 'busy');
      const data = await file_bytes(from, f, (got, all) =>
        toast(t('%1: %2 of %3 blocks…', k.name, got, all), 'busy'));
      items.push({ name: k.name, raw: k.raw,
                   user: to_area === undefined ? k.user : to_area, data });
    }
  } catch (e) { toast(why(e), 'err'); return false }

  if (!put_batch(to, items)) return false;

  /* Приёмник принял ВСЁ — только теперь убираем с источника. */
  if (want_move) {
    const lay = same ? projected.get(from) : proj_snapshot(from);
    try { for (const k of keys) lay.remove_raw(k.raw, k.user) }
    catch (e) {
      /* Копия легла, а источник цел — состояние ИЗМЕНИЛОСЬ, и шаг в журнал
         попасть обязан: иначе откатить эту половинчатую правку будет нечем. */
      toast(t('copied, but disk %1 left as it was: %2', num(from), why(e)), 'err');
      return true;
    }
    projected.set(from, lay);
    for (const k of keys) staged_bytes.delete(bkey(from, k.user, k.raw));
    bump();
  }
  const where = to_area === undefined ? t('disk %1', num(to))
              : same ? t('user area %1', to_area)
              : t('disk %1, user area %2', num(to), to_area);
  /* Хвост про «ещё не записано» ВНУТРИ ключа, а не приклеен к переведённому:
     приклеенный остался бы английским. */
  const what = plural(items.length, 'file', 'files');
  toast(want_move ? t('%1 moved to %2 — not written yet', what, where)
                  : t('%1 copied to %2 — not written yet', what, where), 'ok');
  return true;
}

/* --------------------------------------------------------- отложенные правки
 *
 * Диск меняется НЕ сразу: набранное копится здесь и уходит на диск по кнопке.
 * Диск один, и возможность передумать до записи стоит дороже удобства.
 *
 * Хранится не журнал действий, а желаемое состояние: повторная правка той же
 * метки заменяет прежнюю, а правка обратно к тому, что на диске, убирает запись
 * вовсе. Тогда «поправил пять раз и вернул как было» само собой ничего не
 * пишет, без единого правила схлопывания.
 */
const pending = new Map();              /* ключ 'label:5' -> описание правки */

/* Проекция дискеты — это САМ Layout, а не отдельная модель изменений. Тогда
 * проверка «влезет ли», отрисовка и запись идут через один и тот же уже
 * проверенный код, и разойтись им негде. */
const projected = new Map();            /* номер дискеты -> Layout */
const staged_bytes = new Map();         /* ключ файла -> отложенные байты */

/* Ключ файла — сырые одиннадцать знаков каталога, а не показанное имя.
 *
 * Показываем-то мы склейку «имя.расширение», а разобрать её обратно нельзя: у
 * «SPACE.MA» с расширением «STM» она выходит «SPACE.MA.STM», и где разделитель
 * — по строке не понять. По имени такой файл не нашёлся бы ни для удаления,
 * ни для копирования.
 *
 * Разбирается ключ С КОНЦА: сырые знаки ровно одиннадцать, а внутри самого
 * имени может оказаться и двоеточие. */
const fkey = f => `${f.user}:${f.raw}`;
const unkey = k => ({ user: +k.slice(0, -12), raw: k.slice(-11) });
const bkey = (n, user, raw) => `${n}:${user}:${raw}`;

/* Байты каталога «как будет»: принесённый образ, потом проекция, потом то, что
 * прочитали с диска. Порядок такой, потому что образ ложится на всю дискету и
 * отменяет любую правку по мелочи. */
const raw_of = n =>
  images.has(n)      ? images.get(n).cpm.subarray(0, DIR_SECS * 512)
  : projected.has(n) ? projected.get(n).dir_image()
  :                    dirRaw.get(n);

const proj = n => {
  if (!projected.has(n)) {
    /* Поверх принесённого образа, а не поверх того, что на диске: иначе файл,
       положенный на только что принесённую дискету, ушёл бы в каталог пустой
       дискеты и затёр каталог образа. Порядок записи это чинит: образ уходит
       на диск первым, каталог проекции — за ним. */
    const raw = raw_of(n);
    if (!raw) throw new FitError(t('directory not read yet'));
    projected.set(n, new Layout(raw));
  }
  return projected.get(n);
};

/* Каталог «как будет»: с проекцией, если она есть. */
const cat_of = n => (images.has(n) || projected.has(n))
  ? parseDir(raw_of(n))
  : dirs.get(n);

/* ------------------------------------------------------- перестановка дискет
 *
 * Номер дискеты физический: он привязан к месту на винте и никуда не едет.
 * Едет СОДЕРЖИМОЕ — все 1570 секторов разом, а с ними и метка: она лежит внутри
 * той же дискеты, в предпоследнем её секторе.
 *
 * Хранится не журнал действий, а состояние: order.get(pos) — чья дискета должна
 * оказаться на месте pos. Поменяв местами одну и ту же пару пять раз,
 * пользователь возвращается к исходному порядку, запись из order исчезает, и
 * делать физически нечего. Ровно этого журнал действий не умеет.
 */
const order = new Map();          /* место -> номер дискеты, чьё содержимое туда встанет */
const src_of = pos => ord.src_of(order, pos);
const swap_cycles = () => ord.cycles(order);

/* Править и переставлять одну и ту же дискету можно вместе, и запрещать тут
 * нечего: при применении правки идут ПЕРВЫМИ. Правка ложится на дискету там же,
 * где её каталог и читали, а перестановка увозит дискету уже вместе с ней.
 * Обещание морды — «на месте M окажется дискета N в правленом виде» — так и
 * выполняется. Обратный порядок и правда бы всё сломал, оттого он и оговорён
 * в apply_pending. */
const stage_swap = (a, b) => { ord.swap(order, a, b); bump() };
const unswap = pos => { ord.unswap(order, pos); bump() };

/* ------------------------------------------------------- образ дискеты .fdd
 *
 * Принесённый образ — не правка каталога, а вся дискета целиком, и раскладчику
 * тут делать нечего: кладём 1560 секторов как есть. Оттого и хранится отдельно
 * от projected.
 *
 * Системные дорожки образа отбрасываются, см. from_fdd: на винте они общие и
 * лежат один раз, а у дискет со второй эти 80 секторов — вовсе не их
 * собственные, а хвост предыдущей дискеты.
 */
const images = new Map();       /* номер дискеты -> { name, cpm } */

const has_changes = () =>
  pending.size + projected.size + images.size + swap_cycles().length;

/* Имя CP/M из имени файла с чужой машины: 8.3, знак в знак. Считается при
 * БРОСКЕ и показывается сразу — узнавать о переименовании в момент записи
 * неприятно.
 *
 * Латиница -- ЗАГЛАВНАЯ: ССР поднимает набранное, и файл со строчным именем
 * из командной строки МикроДОС не запустить и не открыть, а файлы с мака почти
 * все строчные. Файлы, уже лежащие на диске, не трогаются: копирование и перенос
 * берут имя из каталога как есть.
 *
 * Заменяется ровно то, чего «Вектор» НЕ НАРИСУЕТ. Мерка именно такая, а не
 * список запретов командной строки: проверено на MicroDOS T-72 — знакогенератор
 * рисует весь диапазон 20h..7Eh, от «!"#$%&'» до «xyz{|}~», и каталог все эти
 * имена показывает. Значит и заменять их не за что. Список разделителей
 * КОМАНДНОЙ СТРОКИ (< > . , ; : = ? * [ ] % | ( ) / \) тут не годится: он
 * уродовал бы имя с процентом или косой чертой на ровном месте, хотя такие
 * файлы на чужих образах встречаются и работают.
 *
 * Отдаём СЫРЫЕ одиннадцать знаков, а не склейку «имя.расширение»: «a.b.c»
 * ложится как «A.B» и «C», и разбирать склейку обратно не приходится.
 *
 * Пробел оставляем и внутри, и в начале: «Вектор» такие файлы хранит, читает и
 * даже заводит сам — через CO, — а мак с ними живёт без единой жалобы. Уходит
 * только хвостовой, и не по строгости: места под него в поле имени нет. */
function suggest_name(fname) {
  const base_ = String(fname).replace(/^.*[\\/]/, '');
  const dot = base_.lastIndexOf('.');
  const nm_ = dot < 0 ? base_ : base_.slice(0, dot);
  const ex_ = dot < 0 ? '' : base_.slice(dot + 1);
  const clean = t => [...t].map(c =>
    (c.charCodeAt(0) < 0x20 || c.charCodeAt(0) > 0x7E) ? '_'
      : (c >= 'a' && c <= 'z') ? c.toUpperCase() : c).join('');
  /* Хвостовой пробел уходит не из строгости: в поле имени он неотличим от
     добивки до восьми знаков, сохранить его негде. ВЕДУЩИЙ остаётся — и мак, и
     «Вектор» с такими файлами живут. Хвостовая точка уходит вместе с пробелом:
     обрезка по восьми знакам может оставить её последней, и «ARCHIVE.» с
     расширением «GZ» показалось бы как «ARCHIVE..GZ». */
  const nm = clean(nm_).slice(0, 8).replace(/[ .]+$/, '') || 'FILE';
  const ex = clean(ex_).slice(0, 3).replace(/ +$/, '');
  return nm.padEnd(8) + ex.padEnd(3);
}

/* Положить файл в проекцию. Бросает FitError с внятной причиной. */
/* Неудавшаяся правка не должна оставлять следа: proj(n) заводит проекцию ДО
 * того, как выяснится, что файл не влезает, и без этого отката в строке
 * изменений повисала бы пустая запись про дискету, на которой ничего не
 * менялось, — например, после пачки файлов, брошенной на забитую дискету. */
const stage_try = (n, fn) => {
  const fresh = !projected.has(n);
  const lay = proj(n);
  try { return fn(lay) }
  catch (e) { if (fresh) projected.delete(n); throw e }
};

/* Правка, вернувшая каталог к тому, что уже лежит на диске, — не изменение.
 * Скопировали файл на соседнюю дискету, там же его удалили — предлагать
 * «Apply» не за что.
 *
 * Сравниваются не сырые байты: удаление гасит только ПЕРВЫЙ байт записи, а
 * остальную тридцать одну систему оставляет от прежнего файла, и побайтно
 * каталог не совпал бы уже никогда. Поэтому свободные записи обнуляются
 * целиком — ровно так на них смотрит и сама система. */
const FREE_SLOT = 0xE5;                 /* признак свободной записи каталога */

function same_as_disk(n) {
  const was = dirRaw.get(n);
  if (!was || images.has(n) || !projected.has(n)) return false;
  /* Отложенные байты — это ещё не записанные блоки; каталог может сойтись, а
     писать всё равно есть что. Ни одного пути к такому в морде сегодня нет:
     всюду, где байты откладываются, каталог заведомо расходится с диском.
     Оставлено подпоркой — уронив проекцию при живых байтах, мы потеряли бы
     файл молча, и цена ошибки несоизмерима с ценой этой строки. */
  for (const k of staged_bytes.keys()) if (k.startsWith(n + ':')) return false;

  const now = projected.get(n).dir_image();
  if (now.length !== was.length) return false;
  const norm = b => {
    const c = b.slice();
    for (let i = 0; i < c.length; i += 32)
      if (c[i] === FREE_SLOT) c.fill(FREE_SLOT, i, i + 32);
    return c;
  };
  const a = norm(was), b = norm(now);
  for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
  return true;
}

const settle = n => { if (same_as_disk(n)) projected.delete(n) };

function stage_add(n, name, data, user = 0) {
  /* Сырые знаки нового файла знает только тот, кто его сложил, — раскладчик
     их и возвращает. */
  let raw;
  stage_try(n, lay => { lay.add(name, data, { user }); raw = lay.last_raw });
  staged_bytes.set(bkey(n, user, raw), data);
  settle(n);
  bump();
}

/* raw, а не имя: файл уже на диске, см. fkey. */
function stage_remove(n, raw, user = 0) {
  stage_try(n, lay => lay.remove_raw(raw, user));
  staged_bytes.delete(bkey(n, user, raw));
  settle(n);
  bump();
}

/* Вернуть потерянные слоты каталога в оборот. Кнопка появляется только когда
 * такие слоты есть, см. Panel. */
function stage_repair(n) {
  const got = proj(n).repair();
  if (!got) projected.delete(n);        /* чинить оказалось нечего — не мусорим
                                           изменением, которого нет */
  bump();
  return got;
}

/* Очистка дискеты. Отложенные для неё байты уходят вместе с каталогом. */
function stage_erase(n) {
  const gone = proj(n).erase();
  [...staged_bytes.keys()].filter(k => k.startsWith(n + ':'))
                          .forEach(k => staged_bytes.delete(k));
  /* Метка описывает содержимое, а его больше нет — стираем и её. Если на диске
     метки и так не было, запись отложенного сама и не заведётся. */
  stage({ kind: 'label', floppy: n, text: '',
          same_as_disk: !(labels.get(n) || '') });
  bump();
  return gone;
}

/* ------------------------------------------------------------ откат по шагам
 *
 * Отменять по одному нужно не «на всякий случай», а по вполне определённой
 * причине: перетаскивание промахивается. Файл уезжает на соседнюю дискету, и
 * без отката остаётся либо тащить его назад руками, либо сбрасывать ВСЕ правки
 * — а их к тому моменту может быть три десятка.
 *
 * ХРАНИМ СНИМКИ, А НЕ ОБРАТНЫЕ ДЕЙСТВИЯ. Обратное действие пришлось бы писать
 * для каждого случая отдельно, и каждое было бы отдельным поводом ошибиться:
 * «положить назад» — это ещё и вернуть область, и байты, и порядок записей в
 * каталоге. Снимок же не знает, что именно откатывает, и потому не может
 * откатить неправильно.
 *
 * Дорого ли. Каталог дискеты 4 КБ, и копируется только он: блоки данных Layout
 * разделяет по ссылке, а править их на месте никто не может — каждая укладка
 * кладёт новые. Тридцать шагов по паре дискет это четверть мегабайта.
 *
 * ЧЕГО ЗДЕСЬ НЕТ: отмены применённого. После записи на диск откатывать нечем —
 * журнал чистится, и кнопка исчезает. */
const UNDO_MAX = 30;
const undo_log = [];                    /* [{ what, snap }], последний в конце */

const snapshot = () => ({
  pending:   new Map(pending),
  projected: new Map([...projected].map(([n, l]) => [n, l.clone()])),
  staged:    new Map(staged_bytes),
  images:    new Map(images),
  order:     new Map(order),
});

function restore(s) {
  const put = (dst, src) => { dst.clear(); for (const [k, v] of src) dst.set(k, v) };
  put(pending, s.pending);
  put(projected, s.projected);
  put(staged_bytes, s.staged);
  put(images, s.images);
  put(order, s.order);
}

/* Шаг пользователя. Снимок делается ДО, а в журнал попадает только если
   действие удалось: неудавшаяся укладка ничего не меняет, и отменять там
   нечего. Исключение проходит насквозь — тогда push просто не выполнится. */
/* Запись в журнал одна на обе обёртки: из двух копий слово в слово сломанной
   оказалась бы ровно та, которую не проверяют. */
function remember(what, snap, ok) {
  if (ok === false) return ok;        /* не вышло — отменять нечего */
  undo_log.push({ what, snap });
  if (undo_log.length > UNDO_MAX) undo_log.shift();
  return ok;
}

function undoable(what, fn) {
  const snap = snapshot();
  return remember(what, snap, fn());
}

/* То же для действий, которые идут в несколько приёмов и через await. */
async function undoable_async(what, fn) {
  const snap = snapshot();
  return remember(what, snap, await fn());
}

const can_undo = () => undo_log.length > 0;
const undo_what = () => undo_log.length ? undo_log[undo_log.length - 1].what : '';

function undo(say) {
  const last = undo_log.pop();
  if (!last) return false;
  restore(last.snap);
  bump();
  if (say) say(t('undone: %1', last.what), 'ok');
  return true;
}

const forget_undo = () => { undo_log.length = 0 };

function drop_changes(n) {
  toast('');
  if (n === undefined) { projected.clear(); staged_bytes.clear(); pending.clear();
                         images.clear(); order.clear() }
  else {
    projected.delete(n);
    images.delete(n);
    [...staged_bytes.keys()].filter(k => k.startsWith(n + ':'))
                            .forEach(k => staged_bytes.delete(k));
  }
  bump();
}

const pend_key = p => p.kind + ':' + p.floppy;

function stage(p) {
  const k = pend_key(p);
  if (p.same_as_disk) pending.delete(k);
  else                pending.set(k, p);
  bump();
}

/* Кириллица разрешена. Кодировка выяснена не догадкой, а по метке, набранной на
 * самой машине: у дискеты 10h на диске лежит F4 E5 EB F3 F4 20 EE E1 20 F2 F5
 * F3 F3 EB EF ED — это КОИ-8, «ТЕКСТ НА РУССКОМ». Наш label_sector даёт ровно
 * те же байты.
 *
 * Регистр не трогаем. В КОИ-8 строчные лежат там, где у КОИ-7 заглавная
 * латиница, но поднимать их до прописных значило бы гадать о чужом
 * знакогенераторе, и строчную метку стало бы не набрать вовсе. Пишем как
 * набрали: КОИ-8 строчные знает (и -> C9), обратно читается тем же.
 *
 * Годно то, что КОИ-8 умеет записать: остальное пришлось бы заменять вопросами,
 * а молча портить набранное хуже, чем отказать. */
const label_ok = t => [...t].every(c => koi8(c) !== 0x3F || c === '?');

/* Разрешение записи берётся при применении, а не заранее: окно короткое, и
 * открывать его на время, пока пользователь думает, незачем. */
/* Само перекладывание — в /order.mjs: оно переписывает дискеты целиком, и
 * ошибка там стирает данные, так что проверяется оно отдельно, в node. Здесь
 * только ввод-вывод по сети. */
const rotate = (cyc, on_step) => ord.rotate(
  cyc, FLOPPY, info.max_count || 64,
  { base,
    read:  (lba, cnt) => bytes(`/api/sectors/${lba}?count=${cnt}`),
    write: (lba, buf) => put(`/api/sectors/${lba}`, buf) },
  on_step);

/* Кэши после перестановки не перечитываются, а переставляются: что лежало у
 * источника, то теперь лежит на месте. Это и точно, и бесплатно. */
function shift_caches() {
  const od = new Map(dirs), or_ = new Map(dirRaw), ol = new Map(labels), ob = new Map(bad);
  for (const pos of order.keys()) {
    const s = src_of(pos);
    for (const [dst, src] of [[dirs, od], [dirRaw, or_], [labels, ol], [bad, ob]])
      src.has(s) ? dst.set(pos, src.get(s)) : dst.delete(pos);
  }
  order.clear();
}

async function apply_pending(say) {
  const labels_todo = [...pending.values()];
  const disks_todo = [...projected.keys()].sort((a, b) => a - b);
  const images_todo = [...images.keys()].sort((a, b) => a - b);
  const cycles = swap_cycles();
  const total = labels_todo.length + disks_todo.length +
                images_todo.length + cycles.length;
  if (!total) return;

  /* Состояние платы СПРАШИВАЕМ, а не берём из памяти: между прошлым ответом и
   * этой минутой её могли перепрошить, переткнуть, перезагрузить. */
  try { info = await (await api('/api/info')).json() } catch (e) { /* ниже разберёмся */ }

  if (!can_write()) { say(t('this board is flashed read-only'), 'err'); return }

  /* Окно берётся ЗДЕСЬ и отпускается в конце: плата открыта на запись ровно
     те секунды, что идёт запись. */
  if (!await take_window(say)) return;

  let done = 0;
  /* Каждый шаг сперва проверяет, не кончается ли окно. Продление на последней
     секунде оставило бы плату запертой посреди перестановки. */
  const step = async what => {
    if (window_soon()) await take_window(say);
    say(t('%1 (%2 of %3)…', what, done + 1, total), 'busy'); bump();
  };

  /* Порядок существенный: СПЕРВА правки, ПОТОМ перестановка.
   *
   * Правка считана по каталогу дискеты и ложится туда же, откуда читалась, —
   * пока дискета не уехала, место совпадает. Перестановка после этого увозит
   * дискету целиком, вместе со свежим каталогом и блоками. Обещание морды —
   * «на месте M окажется дискета N в правленом виде» — выполняется само.
   *
   * Наоборот было бы неверно: правку пришлось бы класть на новое место, а
   * сверку «не изменилось ли на диске» делать уже неизвестно с чем. */
  try {
    /* Образ первым: он ложится на всю дискету, и проекция, если она есть,
       построена ПОВЕРХ его каталога — её запись должна лечь следом. */
    for (const n of images_todo) {
      const img = images.get(n);
      await step(t('disk %1 \u2190 %2', num(n), img.name));
      await write_runs(n, [[0, img.cpm]], (a, b) =>
        say(t('disk %1: %2 of %3 sectors…', num(n), a, b), 'busy'));
      dirRaw.set(n, img.cpm.slice(0, DIR_SECS * 512));
      dirs.set(n, parseDir(dirRaw.get(n)));
      images.delete(n);
      done++;
    }

    for (const n of disks_todo) {
      await step(t('disk %1', num(n)));

      /* Замысел мог устареть: «Вектор» тем временем сам писал на диск. Сверяем
       * каталог с тем, что читали, и отказываемся, если он разошёлся — писать
       * поверх чужих изменений хуже, чем не писать вовсе. */
      const now = await bytes(`/api/sectors/${base(n)}?count=${DIR_SECS}`);
      const was = dirRaw.get(n);
      if (now.length !== was.length || now.some((b, i) => b !== was[i]))
        throw new Error(t('disk %1 changed since it was read', num(n)));
      /* Сверка сходится и после записи образа: dirRaw обновлён на его каталог
         выше, а проекция построена поверх того же каталога. */

      await write_runs(n, projected.get(n).writes(), (a, b) =>
        say(t('disk %1: %2 of %3 sectors…', num(n), a, b), 'busy'));

      dirRaw.set(n, projected.get(n).dir_image());
      dirs.set(n, parseDir(dirRaw.get(n)));
      drop_changes(n);
      done++;
    }

    for (const p of labels_todo) {
      await step(t('label on disk %1', num(p.floppy)));
      await put(`/api/sectors/${base(p.floppy) + LAB_OFF}`, label_sector(p.text));
      labels.set(p.floppy, p.text.trim());
      pending.delete(pend_key(p));
      done++;
    }

    for (const cyc of cycles) {
      await step(cyc.length === 2
             ? t('swapping disks %1 and %2', num(cyc[0]), num(cyc[1]))
             : t('swapping %1', plural(cyc.length, 'disk', 'disks')));
      await rotate(cyc, done_secs =>
        say(t('swapping %1: %2 of %3 sectors…',
              cyc.map(num).join(' ⇄ '), done_secs, FLOPPY), 'busy'));

      /* Сверять прочтением тут нечего.
       *
       * Сличение каталога на каждом месте не годится: каталог это голова
       * дискеты, а испортиться может хвост. Проверка головы даёт уверенность,
       * которой не заслуживает.
       *
       * Настоящая же сверка это перечитать всё перенесённое — плюс сорок
       * процентов ко времени обмена, — и сторожит она то, чего в этой стопке
       * не бывает: сервер на негодную запись отвечает 413, 400 или 416 и НЕ
       * пишет ничего, а всякий не-2xx здесь
       * поднимает исключение и останавливает применение. От обрыва питания
       * посреди переноса не спасёт ни то ни другое. */
      done++;
    }
    /* Кэши двигаются последними — к этому времени в них уже правленые каталоги. */
    if (cycles.length) shift_caches();
  } catch (e) {
    /* Журнал отката чистится и при обрыве, и это не небрежность.
     *
     * Часть правок уже на диске, часть нет, и снимок «как было до шага»
     * описывает состояние, которого больше не существует. Шаг назад по такому
     * снимку вернул бы в проекцию то, что уже записано, — и предложил бы
     * записать это второй раз. Пусть лучше отката не будет вовсе. */
    forget_undo();
    /* И в консоль тоже: строка изменений живёт своим состоянием и при неудачном
     * стечении обстоятельств успевает исчезнуть вместе с сообщением, а знать,
     * на чём именно встало, нужно обязательно. */
    console.error('apply stopped:', e);
    toast(t('apply stopped: %1', why(e)), 'err');
    say(t('stopped after %1 of %2: %3', done, total, why(e)), 'err');
    await drop_window();
    bump();
    return;
  }

  /* Сброс кэша привода — ОДИН раз в конце, а не после каждой записи: ровно за
   * этим команда и нужна. Без неё запись может остаться в кэше самого винта, и
   * выдернутое питание её потеряет. Ошибка тут не отменяет уже записанного, но
   * молчать о ней нельзя: на диске тогда лежит не то, что показано. */
  /* Записано — откатывать нечем: снимки описывают то, чего уже нет на диске. */
  forget_undo();

  const [fc] = await post('/api/flush');
  if (fc !== 200) {
    /* Окно отпускаем и здесь: сброс не удался, но писать больше нечего. */
    await drop_window();
    say(t('written, but the drive did not confirm the flush (%1) — ' +
          'do not power off until it does', fc), 'err');
    bump();
    return;
  }

  await drop_window();
  info = await (await api('/api/info')).json();
  say(t('applied %1', plural(done, 'change', 'changes')), '');
  bump();
}

/* Смежные куски сливаются в один запрос: у большого файла блоков под четыре
 * сотни, и отдельный запрос на каждый — это четыре сотни оборотов по сети там,
 * где хватит двадцати пяти. Предел куска берём у сервера. */
async function write_runs(n, writes, on_step) {
  const lim = (info.max_count || 64) * 512;
  const total = writes.reduce((s, [, d]) => s + d.length, 0) / 512;
  let sent = 0;

  for (let i = 0; i < writes.length; ) {
    /* Кусок КРУПНЕЕ предела дробится, а не отправляется как есть. Раскладчик
       таких не выдаёт — у него блоки по 2 КБ, — а вот целая дискета из образа
       это восемьсот килобайт одним куском, и сервер на такое отвечает 413. */
    if (writes[i][1].length > lim) {
      const [at, data] = writes[i];
      for (let o = 0; o < data.length; o += lim) {
        const part = data.subarray(o, Math.min(o + lim, data.length));
        await put(`/api/sectors/${base(n) + at + o / 512}`, part);
        sent += part.length / 512;
        if (on_step) on_step(sent, total);
      }
      i++;
      continue;
    }

    let j = i + 1, len = writes[i][1].length;
    while (j < writes.length &&
           writes[j][0] === writes[j - 1][0] + writes[j - 1][1].length / 512 &&
           len + writes[j][1].length <= lim) { len += writes[j][1].length; j++ }

    const buf = new Uint8Array(len);
    let o = 0;
    for (let k = i; k < j; k++) { buf.set(writes[k][1], o); o += writes[k][1].length }
    await put(`/api/sectors/${base(n) + writes[i][0]}`, buf);

    sent += len / 512;
    if (on_step) on_step(sent, total);
    i = j;
  }
}

/* --------------------------------------------------------------- приём файлов
 *
 * Байты читаются СРАЗУ при броске, а не при записи. File — это ссылка на файл
 * в системе, и за время раздумий его успеют подвинуть или изменить; прочитали
 * при броске — дальше нам всё равно. Заодно сразу известен размер, а он нужен
 * и для проверки «влезет ли», и для полоски заполнения.
 */
/* Образ дискеты или обычный файл — вопрос при каждом броске извне.
 *
 * По имени, но НЕ по одному лишь хвосту: скачивая второй файл с тем же
 * именем, браузер приписывает номер ПОСЛЕ расширения — «Games-2.fdd 2», — и
 * строгая проверка хвоста пропускала бы такой образ дальше как обычный файл.
 * Там он немедленно упирался бы в «needs 410 blocks, 390 free»: 820 КБ это 410
 * блоков, а дискета держит 390. Отказ выглядел бы так, будто образ не влезает,
 * хотя системные дорожки из него как раз выбрасываются и содержимое влезло бы.
 *
 * И по размеру: образы бывают ровно нескольких длин. Одного размера мало для
 * решения — обычный файл может оказаться такой же длины, — поэтому размер
 * лишь повод заглянуть внутрь, а решает каталог на 80-м секторе.
 *
 * Имя же решает само: назвали .fdd, а каталога внутри нет — человек услышит,
 * почему это не образ, а не увидит, как файл молча лёг на дискету.
 */
const is_fdd = f => /\.fdd\b/i.test(f.name);
const FDD_BYTES = new Set([1600, FDD_SECS, 1648, FDD_BIG_SECS].map(s => s * 512));

async function pick_image(fs_) {
  const named = fs_.find(is_fdd);
  if (named) return named;
  for (const f of fs_) {
    if (!FDD_BYTES.has(f.size)) continue;
    /* Читаем только начало: каталог лежит сразу за зарезервированными
       дорожками, и тянуть ради проверки все 820 КБ незачем. */
    const need = (FDD_SYS + DIR_SECS) * 512;
    const head = new Uint8Array(await f.slice(0, need).arrayBuffer());
    if (head.length === need && looks_like_dir(head.subarray(FDD_SYS * 512)))
      return f;
  }
  return null;
}

/* Один разбор броска на оба места, где он случается: плитка дискеты и панель. */
async function drop_outside(n, fs_) {
  if (!fs_.length) return;
  const img = await pick_image(fs_);
  if (img) take_image(n, img);
  else     take_files(n, fs_);
}

/* Положить принесённый образ на дискету.
 *
 * Только на ПУСТУЮ: образ ложится на всю дискету, и класть его поверх файлов
 * значило бы завести второй способ стереть дискету. Способ уже есть — кнопка
 * очистки, — и пусть он будет один.
 */
async function take_image(n, file) {
  return undoable_async(t('image on disk %1', num(n)), () => take_image_(n, file));
}

async function take_image_(n, file) {
  try {
    if (!dirRaw.has(n)) dirs.set(n, await readDir(n));
    const cat = cat_of(n);
    if (cat && cat.length)
      throw new FddError(t('disk %1 is not empty — erase it first', num(n)));

    const { cpm, dropped } = from_fdd(new Uint8Array(await file.arrayBuffer()));

    /* Образ ложится на ВСЮ дискету и отменяет всё, что на ней набрали до него.
       Без этого очистка, сделанная перед броском, доживала бы до применения и
       ложилась ПОСЛЕ образа — своим пустым каталогом поверх принесённого.
       Файлы после этого не нашлись бы: блоки на месте, а каталога нет. */
    projected.delete(n);
    [...staged_bytes.keys()].filter(k => k.startsWith(n + ':'))
                            .forEach(k => staged_bytes.delete(k));

    images.set(n, { name: file.name, cpm });   /* шаг заводится снаружи, см. вызов */
    /* Метку берём из имени образа, но только если своей нет: чужое имя не
       должно затирать то, что подписал человек. Метка, стёртая очисткой в этой
       же стопке правок, своей не считается — её уже нет. */
    if (!label_of(n).trim()) {
      /* Всё от «.fdd» и дальше — не метка: браузер приписывает туда номер
         второго скачивания («Games 2.fdd 2»), и без этого он попал бы в метку. */
      const t = file.name.replace(/\.fdd\b.*$/i, '').trim().slice(0, LAB_LEN);
      if (label_ok(t)) stage({ kind: 'label', floppy: n, text: t });
    }
    const cnt = (cat_of(n) || []).length;
    toast(t('disk %1 \u2190 %2: %3', num(n), file.name, plural(cnt, 'file', 'files')) +
          (dropped ? t(', %1 tail sectors dropped', dropped) : '') +
          ' — ' + t('not written yet'), 'ok');
  } catch (e) {
    toast(`${file.name}: ${why(e)}`, 'err');
  }
}

/* Длинное чтение кусками по пределу сервера. */
async function read_run(lba, count, on_step) {
  const lim = info.max_count || 64;
  const out = new Uint8Array(count * 512);
  for (let off = 0; off < count; off += lim) {
    const k = Math.min(lim, count - off);
    out.set(await bytes(`/api/sectors/${lba + off}?count=${k}`), off * 512);
    if (on_step) on_step(off + k, count);
  }
  return out;
}

/* Отдать дискету образом .fdd.
 *
 * Зарезервированные 80 секторов у дискеты 1 — её собственные, секторы 2..81
 * винта. У остальных такой области на винте нет вовсе: 80 секторов перед их
 * каталогом это хвост предыдущей дискеты, и подставлять его было бы враньём.
 * Им кладётся E5h — то, что оставляет форматирование.
 */
/* Собрать образ дискеты. Отдельно от скачивания: те же байты кладёт в корзину
 * архива, и второй раз описывать разметку было бы негде ошибиться дважды. */
async function fdd_bytes(n, say) {
  const raw = raw_of(n);
  if (!raw) throw new FddError(t('directory not read yet'));

  /* Сколько читать, решает сама дискета: 1560 секторов обычно, 1568 если она
     заняла блоки 390-391. Размер образа из этого и выйдет — 820 или 830 КБ. */
  const top = top_block(raw);
  if (top > HDD_MAX_BLK)
    throw new FddError(t('the directory of disk %1 points at block %2, past %3 — ' +
                         'it looks damaged', num(n), top, HDD_MAX_BLK));

  say(t('reading…'), 'busy');
  /* Отложенный образ на диске ещё не лежит — отдаём принесённое. */
  const cpm = images.has(n)
    ? images.get(n).cpm
    : await read_run(base(n), cpm_size(top), (got, all) =>
        say(t('%1 of %2 sectors…', got, all), 'busy'));

  /* Зарезервированные дорожки есть только у дискеты 1. */
  const sys = n === 1 ? await read_run(2, FDD_SYS) : null;
  return { data: to_fdd(cpm, sys), name: fdd_name(n, label_of(n)), sys: !!sys };
}

async function download_fdd(n, say) {
  try {
    const { data, name, sys } = await fdd_bytes(n, say);
    save_blob(data, name);
    say(`${Math.round(data.length / 1024)} KB` +
        (sys ? ' ' + t('with the system tracks') : ' ' + t('with empty system tracks')) +
        (data.length > 839680
           ? ' — ' + t('larger than usual: it uses blocks past 389') : ''), '');
  } catch (e) {
    say(why(e), 'err');
  }
}

/* ------------------------------------------------------------------ корзина
 *
 * Складывается сюда броском — файлами и дискетами вперемешку, — а уезжает
 * одним zip. Заведена ради того, чтобы забрать с винта разом всё нужное: по
 * одному файлу за щелчок это занятие на вечер.
 *
 * Байты читаются СРАЗУ при броске, а не при сборке архива. Так корзина не
 * зависит от того, что случилось с диском потом: положили файл, потом стёрли
 * дискету — в архиве всё равно окажется то, что клали. Иначе пришлось бы
 * объяснять человеку, почему скачалось не то, что он видел в списке.
 *
 * Ключ несёт и происхождение: повторный бросок того же файла ничего не
 * добавляет, а заменяет.
 */
const basket = new Map();      /* ключ -> { name, data, from } */

/* Предел на корзину.
 *
 * Байты лежат в памяти вкладки, и весь винт туда не влезет: 324 диска по
 * 820 КБ — это четверть гигабайта, а к моменту упаковки рядом окажется и
 * собранный архив. Вкладка такого не переживёт, и «не переживёт» здесь значит
 * «браузер прибьёт её посреди работы», а не «будет медленно».
 *
 * Отсюда потолок и отказ ДО чтения: положить и обнаружить беду потом — хуже,
 * чем не положить и сказать сразу. Ста двадцати восьми мегабайт хватает на
 * полторы сотни дисков, а кому нужно больше — тому нужен весь винт целиком, и
 * это другая задача: потоковая отдача мимо памяти.
 */
const BASKET_MAX = 128 << 20;

const basket_bytes = () =>
  [...basket.values()].reduce((s, it) => s + it.data.length, 0);

/* true — влезет. Спрашивается ДО чтения, по обещанному размеру. */
function basket_room(need) {
  const have = basket_bytes();
  if (have + need <= BASKET_MAX) return true;
