  toast(t('the archive would grow past %1 — save what is there and start over',
          kb(BASKET_MAX)), 'err');
  return false;
}

/* Имя внутри архива. Дискета зовётся своей меткой, если та годится в имя
 * файла, иначе номером; файл лежит в папке своей дискеты, а непустая область
 * добавляет ещё папку — иначе два одноимённых файла из разных областей
 * столкнулись бы. */
const zip_folder = n =>
  safe_label(label_of(n)) || `disk-${num(n).padStart(3, '0')}`;

/* Имя файла, годное для файловой системы.
 *
 * CP/M и нынешние системы запрещают РАЗНОЕ. По описанию DRI в имени CP/M 2.2
 * нельзя лишь разделители командной строки — < > . , ; : = ? * [ ] — и косой
 * черты среди них НЕТ: «EDIT/I.COM» там законное имя, и на «Векторе» такой файл
 * заводится штатной программой.
 *
 * Правим ровно две вещи, а не весь список запретов Windows: РАЗДЕЛИТЕЛИ ПУТИ и
 * управляющие знаки. Косую — потому что в zip она разделитель папок, и
 * «SLA/SH.TXT» распаковался бы каталогом «SLA»; обратную — по той же причине на
 * той стороне, где разделитель она: имя «..\..\X.COM» на «Векторе» законно, а
 * при распаковке уводит файл из архива наверх, куда его никто не клал.
 *
 * Остальное — двоеточие, звёздочку, вопрос, вертикальную черту — macOS
 * принимает молча, это проверено руками, и подставлять вместо них
 * подчёркивание значит портить имя за чужую систему. Разница между этими двумя
 * списками не в строгости, а в том, что первый меняет СМЫСЛ имени, а второй
 * только вид.
 *
 * Внутри морды имя остаётся как есть: на диске оно именно такое. */
const fs_safe = name => [...String(name)]
  .map(c => (c === '/' || c === '\\' || c.charCodeAt(0) < 0x20) ? '_' : c)
  .join('');

function basket_add(key, name, data, from) {
  basket.set(key, { name, data, from });
  bump();
}

/* Разные дискеты бывают с одной меткой, и тогда имена в архиве совпадут.
 * Расходятся приписью в скобках — так же, как это делает любой браузер, когда
 * скачивает второй файл с тем же именем. */
function zip_entries() {
  const seen = new Map(), out = [];
  for (const it of basket.values()) {
    const k = it.name.toLowerCase();
    const nth = (seen.get(k) || 0) + 1;
    seen.set(k, nth);
    if (nth === 1) { out.push({ name: it.name, data: it.data }); continue }
    const dot = it.name.lastIndexOf('.');
    const stem = dot > 0 ? it.name.slice(0, dot) : it.name;
    const ext  = dot > 0 ? it.name.slice(dot) : '';
    out.push({ name: `${stem} (${nth})${ext}`, data: it.data });
  }
  return out;
}

/* Положить в корзину дискету целиком — тем же образом, что скачивается по
 * значку на плитке. */
async function basket_take_floppy(n) {
  const key = 'fdd:' + n;
  if (basket.has(key)) { toast(t('disk %1 is already in the archive', num(n)), ''); return }
  /* Размер образа известен заранее: он же и есть размер диска. */
  if (!basket_room(FDD_SECS * 512)) return;
  try {
    const { data, name } = await fdd_bytes(n, (text, kind) => toast(text, kind));
    basket_add(key, name, data, `floppy ${num(n)}`);
    toast(t('disk %1 added to the archive', num(n)), 'ok');
  } catch (e) { toast(`${t('disk %1', num(n))}: ${why(e)}`, 'err') }
}

/* И отдельные файлы — те, что сейчас выделены и которые потащили. */
async function basket_take_files(n, keys) {
  const cat = cat_of(n) || [];
  let added = 0;
  try {
    for (const k of keys) {
      const f = cat.find(x => x.user === k.user && x.raw === k.raw);
      if (!f) throw new FitError(t('%1 is gone from disk %2', k.name, num(n)));
      const key = `file:${n}:${f.user}:${f.name}`;
      if (basket.has(key)) continue;
      if (!basket_room(f.size)) return;
      const data = await file_bytes(n, f, (got, all) =>
        toast(t('%1: %2 of %3 blocks…', f.name, got, all), 'busy'));
      const where = zip_folder(n) + (f.user ? `/user ${f.user}` : '');
      basket_add(key, `${where}/${fs_safe(f.name)}`, data, `floppy ${num(n)}`);
      added++;
    }
  } catch (e) { toast(why(e), 'err'); return }
  toast(added ? t('%1 added to the archive', plural(added, 'file', 'files'))
              : t('already in the archive'), added ? 'ok' : '');
}

async function basket_save(say) {
  try {
    say(t('packing…'), 'busy');
    const data = await zip(zip_entries());
    save_blob(data, 'combolite.zip');
    say(`${Math.round(data.length / 1024)} KB`, 'ok');
  } catch (e) { say(why(e), 'err') }
}

/* Убрать выделенное. Всё или ничего, как и всякая пачка: пропал один файл —
 * не убираем ни одного, иначе после отказа непонятно, что уцелело.
 *
 * Отдельной кнопкой, а не Shift'ом при перетаскивании: перенос между дисками
 * это «скопировать и убрать», и, разделив его надвое, мы отдаём второй шаг
 * человеку. Перетащил — файлы на месте и там, и там; не нужны на старом —
 * выделение никуда не делось, жмите. */
function remove_sel(n) {
  const keys = [...st.sel].map(unkey);
  if (!keys.length) return;

  const lay = proj_snapshot(n);
  const errs = [];
  for (const k of keys) {
    try { lay.remove_raw(k.raw, k.user) }
    catch (e) {
      const text = why(e);
      errs.push({ name: Layout.show(k.raw),
                  why: text.startsWith(k.name)
                         ? text.slice(k.name.length).trim() : text });
    }
  }
  if (errs.length) { toast(batch_why(keys.length, errs), 'err'); return }

  projected.set(n, lay);
  for (const k of keys) staged_bytes.delete(bkey(n, k.user, k.raw));
  settle(n);
  st.sel.clear(); st.anchor = '';
  bump();
  toast(t('%1 deleted — not written yet', plural(keys.length, 'file', 'files')), 'ok');
}

/* Снимок текущей проекции дискеты, поверх которого можно примеряться. */
function proj_snapshot(n) {
  if (projected.has(n)) return projected.get(n).clone();
  const raw = raw_of(n);
  if (!raw) throw new FitError(t('directory not read yet'));
  return new Layout(raw);
}

/* Отказ одной строкой: одинаковые причины схлопываются в число, иначе семь
 * строк «уже есть на дискете» занимают пол-экрана и ничем не полезнее одной.
 *
 * «refused», а не «did not fit»: не влезть — лишь одна из причин, и когда имя
 * просто занято, «не влезло» прямо врёт. А «nothing changed» вместо «nothing
 * added» потому, что этой же дорогой ходит перенос: там при отказе не только
 * ничего не добавилось, но и с источника ничего не убыло.
 */
function batch_why(total, errs) {
  const by = new Map();
  for (const { name, why } of errs) {
    if (!by.has(why)) by.set(why, []);
    by.get(why).push(name);
  }
  const parts = [...by].map(([why, names]) => names.length === 1
    ? `${names[0]}: ${why}`
    : t('%1 and %2 more: %3', names[0], names.length - 1, why));
  /* На одном файле «1 of 1 refused» звучит нелепо — счёт тогда ни к чему. */
  return t('nothing changed') +
         (total > 1 ? t(', %1 of %2 refused', errs.length, total) : '') +
         ` — ${parts.join('; ')}`;
}

/* Пакетная укладка: ВСЁ ИЛИ НИЧЕГО.
 *
 * Пачка сперва складывается на снимке проекции, и настоящая правка происходит,
 * только если сошлось всё. Половина уложенного — худший исход: на дискете
 * оказывается непонятно что, и разбираться, чего именно не хватило, приходится
 * задним числом.
 *
 * items: [{ name, user, data, from }] — from только для сообщения об отказе.
 * Возвращает true, если уложилось.
 */
function put_batch(n, items) {
  let lay;
  try { lay = proj_snapshot(n) }
  catch (e) { toast(`${t('disk %1', num(n))}: ${why(e)}`, 'err'); return false }

  const errs = [];
  for (const it of items) {
    try { lay.add(it.name, it.data, { user: it.user || 0, raw: it.raw });
          it.put_raw = lay.last_raw }
    catch (e) {
      /* Раскладчик называет имя в отказе сам — второй раз незачем. */
      const text = why(e);
      errs.push({ name: it.from || it.name,
                  why: text.startsWith(it.name)
                         ? text.slice(it.name.length).trim() : text });
    }
  }
  if (errs.length) { toast(batch_why(items.length, errs), 'err'); return false }

  /* Сошлось — снимок встаёт на место проекции вместе с байтами. */
  projected.set(n, lay);
  for (const it of items)
    staged_bytes.set(bkey(n, it.user || 0, it.put_raw), it.data);
  settle(n);
  bump();
  return true;
}

async function take_files(n, list) {
  if (!dirRaw.has(n)) {
    try { dirs.set(n, await readDir(n)) }
    catch (e) { toast(`${t('disk %1', num(n))}: ${why(e)}`, 'err'); return }
  }

  const items = [];
  for (const file of list) {
    const raw = suggest_name(file.name);
    items.push({ raw, name: Layout.show(raw), from: file.name,
                 data: new Uint8Array(await file.arrayBuffer()) });
  }

  if (put_batch(n, items))
    toast(t('added %1', plural(items.length, 'file', 'files')) + ' ' +
          t('to disk %1 — not written yet', num(n)), 'ok');
}

/* ------------------------------------------------------------ составные части */
const html = htm.bind(h);

/* ОТКРЫТА БЫВАЕТ ТОЛЬКО ОДНА. Плашек с всплывашками три — привод, сеть,
 * корзина, — и у каждой своё состояние. Чужой щелчок открытое не гасит:
 * плашка останавливает всплытие, чтобы не закрыть себя же, а заодно прячет
 * событие и от соседей. Без общего правила две всплывашки наезжали бы друг на
 * друга и обе оставались бы открытыми.
 *
 * СОСТОЯНИЕ ОСТАЁТСЯ МЕСТНЫМ, а сговариваются плашки событием. С именем
 * открытой в общем st и вызовом bump() всплывашка появлялась бы через
 * СЕКУНДУ: bump перерисовывает корень, а под ним триста двадцать четыре
 * плитки. Открытие одной коробочки не стоит перерисовки всего диска.
 *
 * Событием же уходит и тройное повторение слушателей: щелчок мимо и Escape
 * закрывают открытое. */
function usePop(name) {
  const [open, set] = useState(false);
  const box = useRef(null);

  const setOpen = next => {
    const want = typeof next === 'function' ? next(open) : next;
    /* Объявляем ДО того, как открылись: соседи успевают закрыться, и в этот
       миг открытых двое, а не ноль. Наоборот было бы мигание. */
    if (want) dispatchEvent(new CustomEvent('combo-pop', { detail: name }));
    set(want);
  };

  useEffect(() => {
    const other = e => { if (e.detail !== name) set(false) };
    addEventListener('combo-pop', other);
    return () => removeEventListener('combo-pop', other);
  }, [name]);

  useEffect(() => {
    if (!open) return;
    const off = () => set(false);
    const esc = e => { if (e.key === 'Escape') set(false) };
    addEventListener('click', off);
    addEventListener('keydown', esc);
    return () => { removeEventListener('click', off); removeEventListener('keydown', esc) };
  }, [open]);

  /* НЕ ДАТЬ КОРОБОЧКЕ УЕХАТЬ ЗА КРАЙ — здесь, а не в каждой по отдельности.
   *
   * Такие вещи повторяются в каждой новой коробочке (у всплывашки обновления,
   * например, текст шире, чем место слева от плашки), и писать их заново
   * значит однажды забыть.
   *
   * Считать приходится по месту: ширину задаёт текст, и до отрисовки её никто
   * не знает. Пересчёт после КАЖДОГО рендера, потому что содержимое меняется
   * вместе с шириной: пришёл обзор эфира, сменилась надпись на кнопке. И на
   * resize: сдвиг, посчитанный для широкого экрана, на узком уводит коробочку
   * далеко влево. */
  useLayoutEffect(() => {
    const el = box.current;
    if (!open || !el) return;

    const nudge = () => {
      el.style.transform = '';
      const left = el.getBoundingClientRect().left;
      if (left < 8) el.style.transform = `translateX(${Math.ceil(8 - left)}px)`;
    };
    nudge();
    addEventListener('resize', nudge);
    return () => removeEventListener('resize', nudge);
  });

  return [open, setOpen, box];
}

/* Показатель сети. Отдельно от привода, и это не косметика: сила сигнала,
 * обзор эфира и журнал платы к диску отношения не имеют вовсе, и рядом с его
 * моделью и объёмом человек, спрашивая «что с диском», получал бы ответ про
 * радио.
 *
 * Журнал живёт здесь же, хотя он и шире сети. Почти всё, что плата пишет, —
 * про подключение и старт, и заводить третью плашку ради одной кнопки было бы
 * хуже, чем поселить её у ближайшего родственника. */
function Radio() {
  const [open, setOpen, box] = usePop('radio');
  /* Что плата рассказывает о себе: обзор эфира и журнал.
     null — ничего не показано, иначе имя раздела и его текст. */
  const [said, setSaid] = useState(null);

  /* Спросить плату и показать ответ как есть. Оба ответа — текст, набранный
     самой платой; морда его не разбирает и не переводит. Это её слова, и
     сверять их придётся с тем, что видно в UART, — слово в слово. */
  const ask = async (what, path) => {
    setSaid({ what, text: t('asking the board…') });
    try { setSaid({ what, text: await (await api(path)).text() }) }
    catch (e) { setSaid({ what, text: why(e) }) }
  };

  useEffect(() => { if (!open) { setSaid(null); setArm(false) } }, [open]);

  /* ЗАБЫТЬ СЕТЬ -- со второго нажатия, и первое объясняет, чем это кончится:
     плата уйдёт из этой сети и поднимет свою точку, а вернуть её можно будет
     только с телефона рядом или шнурком (combo.py forget говорит то же). */
  const [arm, setArm] = useState(false);
  const forget = async () => {
    if (!arm) { setArm(true); return }
    setArm(false);
    setSaid({ what: 'forget', text: t('asking the board…') });
    try {
      await api('/api/wifi/forget', { method: 'POST' });
      setSaid({ what: 'forget', text: t('The board forgot the network and restarts into setup: ' +
        'connect to its own network combolite-XXXX and open http://192.168.4.1/') });
    } catch (e) { setSaid({ what: 'forget', text: why(e) }) }
  };


  /* Ноль значит «не спрашивай»: так отвечает сервер над образом, где радио нет.
     Плашки тогда нет — пустого места она не занимает. */
  if (!info || !info.rssi) return null;

  /* ЦВЕТ ГОВОРИТ НЕ О КРАСОТЕ СИГНАЛА, А О ТОМ, ЧТО ПЛАТА СОБИРАЕТСЯ ДЕЛАТЬ.
   *
   * Границы приходят с платы (signal_fair, signal_poor) — это ровно те числа,
   * по которым она решает, перебираться ли на другую точку. Зелёный: связь
   * хороша, плата не тронется с места. Жёлтый: уйдёт, если сеть переведёт её
   * сама, без разрыва. Красный: связь мешает работать, и плата будет уходить
   * своими силами, разрывая соединения.
   *
   * Знай морда эти числа отдельно — они разошлись бы с платой при первой же
   * правке порогов, и цвет начал бы врать. */
  const fair = info.signal_fair || -65;
  const poor = info.signal_poor || -75;
  const level = info.rssi >= fair ? 'ok' : info.rssi >= poor ? 'warn' : 'bad';

  return html`<div class="meta radio">
    <button class=${'pill lamp ' + level + (open ? ' on' : '')}
            data-tip=${t('signal strength, and what the board sees around')}
            onClick=${e => { e.stopPropagation(); setOpen(o => !o) }}
            >${t('%1 dBm', info.rssi)}</button>
    ${open && html`<div class="pop" ref=${box} onClick=${e => e.stopPropagation()}>
      ${/* Обзор эфира и журнал — то, за чем иначе пришлось бы лезть кабелем.
           Спрашиваются по нажатию, а не сами: обзор идёт по всем каналам пару
           секунд и всё это время занимает плату — она однопоточная. */''}
      <div class="asks">
        <button data-tip=${t('the scan takes a couple of seconds and holds the board')}
                onClick=${() => ask('wifi', '/api/wifi')}>${t('the air')}</button>
        <button onClick=${() => ask('log', '/api/log')}>${t('the log')}</button>
        <button data-tip=${t('the board leaves this network and raises its own for setup')}
                onClick=${forget}
                >${arm ? t('once more — the board leaves the network') : t('forget the network')}</button>
      </div>
      ${arm && html`<p class="note bad">${t('The board will raise its own network combolite-XXXX; ' +
        'it can be set up again only from a phone nearby or over the USB cable.')}</p>`}
      ${said && html`<pre class="said">${said.text}</pre>`}
    </div>`}
  </div>`;
}

/* Версия прошивки — ВСЕГДА на виду, а не только когда есть что поставить.
 *
 * В подробностях обновления её видно лишь в минуту, когда обновление
 * выпущено, а спрашивают её в другую: «что у меня
 * стоит» — вопрос сам по себе, и чаще всего он возникает как раз тогда, когда
 * ничего не происходит.
 *
 * Место — в подвале, напротив итога обхода. У названия, как это заведено в
 * программах, она спорила бы за внимание с состоянием привода и сети, а
 * спрашивают её реже них. Внизу справа она на виду и никому
 * не мешает: строка итога и без того тянется через всю ширину, а правый её
 * край пустует.
 *
 * Мелко и приглушённо — это подпись, а не сообщение; в подсказке ещё и раздел,
 * из которого плата загрузилась. */
function Version() {
  if (!info || !info.version) return null;
  return html`<span class="ver"
    data-tip=${t('firmware version; the board booted from %1', info.firmware || '?')}
    >${info.version}</span>`;
}

/* Плашка обновления. Её нет, пока обновлять нечего, — и это главное в ней.
 *
 * Плата смотрит манифест сама, раз в сутки, но НЕ ставит без спроса: ошибка в
 * сборке уехала бы разом на все платы, а откат ловит только незапуск —
 * прошивка, которая поднимается и работает неправильно, откатом не ловится.
 * Поэтому решение за человеком, и всё, что делает морда, — показывает, что
 * выпущено, и ждёт нажатия. */
/* Плашка говорит «в раздаче другая версия», а НЕ «есть новее», и это точность,
 * а не осторожность. Плата сравнивает версии на РАВЕНСТВО: «git describe» не
 * сравнить на больше-меньше, а откат на прежнюю бывает нужен не реже
 * обновления. Значит здесь честно показать различие и дать решить человеку.
 *
 * После заливки свежей прошивки шнурком в раздаче лежит предыдущая, и плашка
 * предлагает «обновиться» на неё. Слово «новее» в ней было бы неправдой. */
function Update() {
  const [open, setOpen, box] = usePop('update');
  const [busy, setBusy] = useState('');

  const upd = st.upd;
  if (!upd || !upd.available) return null;

  /* И ещё раз, СВОИМИ ГЛАЗАМИ: та ли это версия, что уже работает.
   *
   * Признак available плата посчитала когда-то раньше, а ответ живёт в памяти
   * вкладки. Плата успела обновиться и перезагрузиться — вкладка об этом не
   * знает и показывает плашку, будто обновление не прошло. Ровно это и видно
   * после установки: обновился, вошёл заново, а тебе снова предлагают
   * обновиться. Cmd+R «чинит», и от этого только тревожнее — выходит, дело в
   * какой-то ворожбе.
   *
   * Сравнить самим ничего не стоит: обе версии у нас на руках. Кроме ПЛИС:
   * её версию знает только плата (sha прошитого образа), и при одинаковой
   * прошивке ESP плашка всё равно нужна, если ПЛИС в раздаче другая. */
  if (info && info.version && upd.version === info.version && !upd.fpga) return null;

  const go = async () => {
    /* Долго: мегабайт по чужой сети — это десятки секунд, и всё это время
       плата занята, она однопоточная. Говорим об этом прямо, иначе человек
       решит, что всё повисло, и станет жать снова. */
    setBusy(upd.fpga ? t('downloading and flashing the FPGA… this takes a few minutes')
                     : t('downloading… this takes a minute'));
    try {
      /* api, а не post: post отказ глотает, и плашка сказала бы
         «установлено» на неудачу. */
      const r = await (await api('/api/update/apply', { method: 'POST' })).json();
      /* Поставили — значит показывать больше нечего. Ждать, пока это заметит
         фоновый опрос, незачем: мы и так знаем, чем кончилось. */
      st.upd = null;
      if (r.reboot !== 'required') { setBusy(t('installed')); return }
      setBusy(t('installed — restarting the board'));
      await post('/api/reboot');
      /* Плата уходит в перезагрузку; страница переживёт это сама, когда
         вернётся связь. */
    } catch (e) {
      setBusy(why(e));
    }
  };

  return html`<div class="meta wide-pop">
    <button class=${'pill mode warn' + (open ? ' on' : '')}
            data-tip=${t('the published firmware differs from the one running')}
            onClick=${e => { e.stopPropagation(); setOpen(o => !o) }}
            >${t('in the release: %1', upd.version)}</button>
    ${open && html`<div class="pop" ref=${box} onClick=${e => e.stopPropagation()}>
      <div><span>${t('published')}</span><b>${upd.version}</b></div>
      <div><span>${t('running now')}</span><b>${(info && info.version) || '—'}</b></div>
      <div><span>${t('slot')}</span><b>${(info && info.firmware) || '—'}</b></div>
      ${upd.fpga && html`<div><span>${t('FPGA')}</span><b>${t('will be reflashed')}</b></div>`}
      <p class="note">${t('The board downloads it itself and checks the signature. ' +
        'The old firmware stays in the spare slot: if the new one does not start, ' +
        'the board comes back to it by itself.')}</p>
      ${upd.fpga && html`<p class="note bad">${t('Flashing the FPGA restarts the machine: ' +
        'save what you are working on.')}</p>`}
      <div class="asks">
        <button disabled=${!!busy} onClick=${go}
                >${busy || t('install and restart')}</button>
      </div>
    </div>`}
  </div>`;
}

/* --------------------------------------------------------------- плата
 *
 * Узлы ПЛИС помимо привода (firmware/board.h): какие устройства отвечают на шине,
 * откуда ВГ93 берёт готовность, VGA, ВИ53, клавиши машины, подставной
 * загрузчик и экран. Что есть в битстриме, плата говорит сама (features) --
 * чего нет, того и в списке нет.
 *
 * Настройки меняются сразу, без «применить»: каждую плата хранит у себя и
 * заливает в ПЛИС после включения и перезаливки, а ответ на смену -- уже новое
 * состояние, его и рисуем.
 *
 * ВВОД и СБР перезагружают машину, поэтому со второго нажатия: первое
 * переписывает кнопку предупреждением. */
/* Функцией, а не таблицей: t() должен звать язык в момент отрисовки, а
   проверка перевода -- видеть строки в вызовах t(). */
const devs = () => [[1, t('floppy controller'), 'fdc'], [2, t('quasi-disk 10h'), ''],
                    [4, t('quasi-disk 11h'), 'kvaz2'], [8, t('hard drive'), ''],
                    [16, t('AY sound'), 'ay'], [32, t('screen mirror'), 'mirror']];

function Board() {
  const [open, setOpen, box] = usePop('board');
  const [b, setB] = useState(null);
  const [arm, setArm] = useState('');
  const [err, setErr] = useState('');
  const [scr, setScr] = useState(false);

  const call = async (path, method) => {
    try { setB(await (await api(path, { method })).json()); setErr('') }
    catch (e) { setErr(why(e)) }
  };
  /* Один раз при входе -- есть ли плата вообще; дальше -- при каждом
     открытии, чтобы клавиши и загрузчик были не вчерашние. */
  useEffect(() => { call('/api/board', 'GET') }, []);
  useEffect(() => { if (open) call('/api/board', 'GET'); else setArm('') }, [open]);

  /* Сервер над образом и старый битстрим ПЛИС: показывать нечего. */
  if (!b || !b.present) return null;
  const f = b.features, s = b.settings;
  const set = q => call('/api/board/settings?' + q, 'POST');
  const key = k => {
    if (arm !== k) { setArm(k); return }
    setArm('');
    call('/api/board/keys?k=' + k, 'POST');
  };
  const ld = b.loader;

  return html`<div class="meta wide-pop board">
    <button class=${'pill lamp ok' + (open ? ' on' : '')}
            data-tip=${t('the FPGA: devices on the bus, the machine keys, the screen')}
            onClick=${e => { e.stopPropagation(); setOpen(o => !o) }}
            >${t('board')}</button>
    ${open && html`<div class="pop" ref=${box} onClick=${e => e.stopPropagation()}>
      <h4>${t('devices on the bus')}</h4>
      ${devs().filter(([, , need]) => !need || f[need]).map(([bit, name]) =>
        html`<label key=${bit} class="chk"><input type="checkbox"
               checked=${!(s.dev_off & bit)}
               onChange=${() => set('dev_off=' + (s.dev_off ^ bit))}/>${name}</label>`)}
      ${f.fdc && html`<div><span>${t('floppy ready')}</span>
        <select value=${s.fdc_rdy} onChange=${e => set('fdc_rdy=' + e.target.value)}>
          ${[t('pin 34'), t('by index'), t('always')].map((n, i) =>
            html`<option key=${i} value=${i}>${n}</option>`)}</select></div>`}
      ${f.fdc && html`<div><span>${t('floppy cable')}</span>
        <select value=${s.fdd_cable || 0} onChange=${e => set('fdd_cable=' + e.target.value)}
                data-tip=${t('PC cable with a twist: Gotek on the middle connector (S1) is A:, the 3.5" drive after the twist (DS0) is B:')}>
          <option value="0">${t('straight, Shugart')}</option>
          <option value="1">${t('PC, with a twist')}</option></select></div>`}
      ${f.fdc && html`<div><span>${t('write precompensation')}</span>
        <select value=${s.fdc_pc & 15}
                onChange=${e => set('fdc_pc=' + ((s.fdc_pc & 16) | +e.target.value))}>
          ${Array.from({ length: 16 }, (_, i) => html`<option key=${i} value=${i}
            >${i ? t('%1 ns', String(i * 62.5)) : t('none')}</option>`)}</select></div>`}
      ${f.fdc && (s.fdc_pc & 15) > 0 && html`<label class="chk"><input type="checkbox"
               checked=${!!(s.fdc_pc & 16)}
               onChange=${() => set('fdc_pc=' + (s.fdc_pc ^ 16))}/>${t('only from track 44')}</label>`}
      ${f.video && html`<div><span>${t('VGA output')}</span>
        <select value=${s.vga60} onChange=${e => set('vga60=' + e.target.value)}>
          <option value="1">${t('60 Hz')}</option>
          <option value="0">${t('50 Hz (576p)')}</option></select></div>`}
      ${f.vi53 && html`<div><span>${t('timer sound')}</span>
        <select value=${s.vi53 ? 1 : 0} onChange=${e => set('vi53=' + e.target.value)}>
          <option value="1">${t('ours')}</option>
          <option value="0">${t('the machine’s')}</option></select></div>`}
      ${(f.keys || f.loader || f.video) && html`<h4>${t('the machine')}</h4>`}
      ${f.keys && html`<div class="asks">
        <button data-tip=${t('reboots the machine from ROM')} onClick=${() => key('vvod')}
                >${arm === 'vvod' ? t('once more — it reboots') : t('VVOD')}</button>
        <button data-tip=${t('boots the machine with the ROM switched off')}
                onClick=${() => key('sbr')}
                >${arm === 'sbr' ? t('once more — it reboots') : t('SBR')}</button></div>`}
      ${f.loader && html`<div><span>${t('the machine boots')}</span>
        <select value=${s.boot || 0} onChange=${e => set('boot=' + e.target.value)}
                data-tip=${t('after VVOD on the keyboard the board presses SBR itself')}>
          <option value="0">${t('from ROM')}</option>
          <option value="1">${t('via the boot loader at power-on')}</option>
          ${(f.kbd_reset || s.boot === 2) && html`<option value="2"
            >${t('via the boot loader, also after VVOD')}</option>`}</select></div>`}
      ${f.loader && html`<div><span>${t('boot loader')}</span>
        <b>${ld.window ? t('window open') : ld.armed ? t('armed') : t('not armed')}</b></div>`}
      ${f.loader && html`<div class="asks">
        <button onClick=${() => call('/api/board/loader?k=arm', 'POST')}>${t('arm')}</button>
        <button onClick=${() => call('/api/board/loader?k=boot', 'POST')}>${t('arm and boot')}</button>
        <button onClick=${() => call('/api/board/loader?k=off', 'POST')}>${t('disarm')}</button></div>`}
      ${f.video && html`<div class="asks">
        <button onClick=${() => { setOpen(false); setScr(true) }}>${t('the screen')}</button></div>`}
      ${err && html`<p class="note bad">${err}</p>`}
    </div>`}
    ${scr && html`<${Screen} onClose=${() => setScr(false)}/>`}
  </div>`;
}

/* Условные цвета -- на битстрим, который палитру не отдаёт. Те же, что у
   combo.py screen. */
const SCREEN_RGB = [[0,0,0],[0,0,170],[0,170,0],[0,170,170],[170,0,0],[170,0,170],
  [170,85,0],[170,170,170],[85,85,85],[85,85,255],[85,255,85],[85,255,255],
  [255,85,85],[255,85,255],[255,255,85],[255,255,255]];

/* Байт палитры «Вектора» BBGGGRRR -> RGB. У синего два разряда. Так же
   считает combo.py screen. */
const vectorRGB = b => [(b & 7) * 255 / 7 | 0, ((b >> 3) & 7) * 255 / 7 | 0,
                        ((b >> 6) & 3) * 255 / 3 | 0];

/* Снимок: 256 строк по 128 байт, слои 0..3 по 32 колонки (firmware/board.h),
   за ними 17 байт, если битстрим их отдаёт (firmware/http.c, api_screen):
   палитра и порт B. Номер цвета -- как в fpga/hdl/vid_play.v: слой 0 -- старший разряд. В
   режиме 512 (разряд 4 порта B) точка делится пополам: левая --
   {0, 0, c1, c0}, правая -- {c3, c2, 0, 0}, тоже как в vid_play.v. */
const SCREEN_BYTES = 256 * 128;
const hasPal = f => f.length >= SCREEN_BYTES + 17;
const is512 = f => hasPal(f) && !!(f[SCREEN_BYTES + 16] & 0x10);
function paint(g, f) {
  const pal = hasPal(f)
    ? Array.from(f.subarray(SCREEN_BYTES, SCREEN_BYTES + 16), vectorRGB) : SCREEN_RGB;
  const w = is512(f) ? 512 : 256;
  const im = g.createImageData(w, 256);
  for (let y = 0; y < 256; y++)
    for (let c = 0; c < 32; c++) {
      const o = y * 128 + c;
      const p0 = f[o], p1 = f[o + 32], p2 = f[o + 64], p3 = f[o + 96];
      for (let b = 7; b >= 0; b--) {
        const n = ((p0 >> b) & 1) << 3 | ((p1 >> b) & 1) << 2 | ((p2 >> b) & 1) << 1 | ((p3 >> b) & 1);
        const put = (x, rgb) => {
          const at = (y * w + x) * 4;
          im.data[at] = rgb[0]; im.data[at + 1] = rgb[1]; im.data[at + 2] = rgb[2]; im.data[at + 3] = 255;
        };
        const x = c * 8 + 7 - b;
        if (w === 256) put(x, pal[n]);
        else { put(2 * x, pal[n & 3]); put(2 * x + 1, pal[n & 12]); }
      }
    }
  g.putImageData(im, 0, 0);
}

function Screen({ onClose }) {
  const cv = useRef(null);
  const [say, setSay] = useState('');
  const [real, setReal] = useState(true);
  const [w, setW] = useState(256);
  const [live, setLive] = useState(false);
  const [fps, setFps] = useState(0);
  /* Ход живого показа -- свой предмет на каждый запуск, не флаг: выключили и
     сразу включили, а прежний круг ещё ждёт ответа платы. С флагом он бы
     ожил вместе с новым, и кадры просили бы двое. */
  const run = useRef(null);

  const show = f => {
    const nw = is512(f) ? 512 : 256;
    /* ширину холста -- до рисования и только при смене: смена холст очищает */
    if (cv.current && cv.current.width !== nw) cv.current.width = nw;
    const g = cv.current && cv.current.getContext && cv.current.getContext('2d');
    if (g) paint(g, f);
    setW(nw);
    setReal(hasPal(f));
  };
  const grab = async () => {
    setSay(t('asking the board…'));
    try { show(await bytes('/api/screen')); setSay('') } catch (e) { setSay(why(e)) }
  };
  useEffect(() => {
    grab();
    const esc = e => { if (e.key === 'Escape') onClose() };
    addEventListener('keydown', esc);
    return () => { run.current = null; removeEventListener('keydown', esc) };
  }, []);

  /* Живой показ: следующий кадр просится, когда пришёл прежний. Отдельного
     потока у платы нет -- тот же /api/screen по кругу, поэтому частота -- это
     сколько плата собирает кадр плюс дорога. Кадр собирается построчно, пока
     машина рисует: в быстрой игре возможен разрыв по высоте. */
  useEffect(() => {
    if (!live) return;
    const me = {};
    run.current = me;
    (async () => {
      let n = 0, t0 = performance.now();
      setFps(0);
      while (run.current === me) {
        try { show(await bytes('/api/screen')); setSay('') }
        catch (e) { if (run.current === me) { setSay(why(e)); setLive(false) } return }
        n++;
        const dt = performance.now() - t0;
        if (dt >= 1000) { setFps(n * 1000 / dt); n = 0; t0 = performance.now() }
        /* Отдать ход между кадрами: без этого быстрый ответ (сервер над образом, кэш)
           крутит круг одними обещаниями, и ни отрисовка, ни таймеры страницы
           до своей очереди не доходят. */
        await new Promise(r => setTimeout(r, 0));
      }
    })();
    return () => { if (run.current === me) run.current = null };
  }, [live]);

  return html`<div class="veil" onClick=${onClose}>
    <div class="help screen" onClick=${e => e.stopPropagation()}>
      <div class="hhead"><b>${t('The screen of the machine')}</b>
        <label class="chk sm"><input type="checkbox" checked=${live}
          onChange=${() => setLive(!live)}/>${t('live')}</label>
        <button class="sm" disabled=${live} onClick=${grab}>${t('refresh')}</button>
        <button class="sm" onClick=${onClose}>${t('Close')}</button></div>
      <canvas ref=${cv} width=${w} height="256"></canvas>
      <p class="note">${say || (live && fps ? t('%1 frames a second', fps.toFixed(1)) + ' · ' : '') + (real
        ? t('the palette is the one of the frame: colour changes under the beam are not shown')
        : t('the colors are arbitrary: the board does not know the palette'))}</p>
    </div>
  </div>`;
}

/* ---------------------------------------------------------- разметка карты
 *
 * Новая карта не размечена на дискеты: в заголовке (сектор 0, 80h..85h) нет
 * ни геометрии, ни числа дискет. На «Векторе» её размечают INITHDD6 и
 * FRMTHDD6 из набора ImproverX (TESTHDD-for-Vector06c); здесь -- то же самое:
 *   * заголовок, как пишет INITHDD6: секторов на дорожке, головок, НОМЕР
 *     последнего цилиндра и число дискет, остальные байты сектора 0 -- как
 *     были. Геометрия -- из IDENTIFY привода (поле chs в /api/info): по ней
 *     МикроДОС переводит свои адреса в CHS, и другая геометрия развела бы
 *     дискеты «Вектора» и наши;
 *   * каталоги всех дискет -- E5h, как FRMTHDD6. Системная область (секторы
 *     2..81) не трогается.
 * Дискет -- сколько влезает в CHS-объём, не больше 10686 (предел ПО
 * «Вектора», README у ImproverX). Морда предлагает разметку, ТОЛЬКО когда
 * разметки нет: размеченную карту отсюда переразметить нельзя. */
const MAX_FLOPPIES = 0x29BE;

function InitDisk() {
  const [c, h, s] = (info && info.chs) || [0, 0, 0];
  const cap = c && h && s ? Math.min(info.sectors, c * h * s) : 0;
  const max = cap > FIRST ? Math.min(Math.floor((cap - FIRST) / FLOPPY), MAX_FLOPPIES) : 0;
  const [n, setN] = useState(max);
  const [arm, setArm] = useState(false);
  const [say, setSay] = useState('');
  const [busy, setBusy] = useState(false);

  const ok = Number.isInteger(n) && n >= 1 && n <= max;
  const go = async () => {
    if (!ok) return;
    if (!arm) { setArm(true); return }
    setArm(false); setBusy(true);
    const fail = m => { setSay(m); setBusy(false) };
    if (!(await take_window((m) => fail(m)))) return;
    try {
      setSay(t('writing the disk header…'));
      const s0 = await bytes('/api/sectors/0');
      s0[0x80] = s; s0[0x81] = h;
      s0[0x82] = (c - 1) & 0xFF; s0[0x83] = (c - 1) >> 8;
      s0[0x84] = n & 0xFF; s0[0x85] = n >> 8;
      await put('/api/sectors/0', s0);
      const dir = new Uint8Array(DIR_SECS * 512).fill(0xE5);
      for (let i = 1; i <= n; i++) {
        if (window_soon() && !(await take_window(m => { throw new Error(m) }))) return;
        await put(`/api/sectors/${base(i)}`, dir);
        if (i % 8 === 0 || i === n) setSay(t('clearing the directories: %1 of %2', i, n));
      }
      await drop_window();
      st.no_layout = false;
      await loadGeom();
      bump();
      await loadLabels();
      scan_all();
      toast(t('the card is laid out: %1 disks', n));
    } catch (e) {
      fail(why(e));
      await drop_window();
    }
  };

  return html`<div class="initdisk">
    <h3>${t('The card is not laid out on disks')}</h3>
    <p>${t('There is no disk layout in its header: it is new or was used elsewhere. ' +
          'The board can lay it out the way INITHDD6 and FRMTHDD6 do on the Vector.')}</p>
    ${!max ? html`<p class="note bad">${t('The board does not know the drive geometry: ' +
          'update the ESP firmware or lay the card out on the Vector with INITHDD6.')}</p>`
    : !can_write() ? html`<p class="note bad">${t('refused — the board is read-only')}</p>`
    : html`
      <div><span>${t('geometry')}</span><b>${c} × ${h} × ${s}</b></div>
      <div><span>${t('disks, at most %1', max)}</span>
        <input type="number" min="1" max=${max} value=${n} disabled=${busy}
               onInput=${e => { setN(+e.target.value); setArm(false) }}/></div>
      <p class="note">${t('The directories of all these disks are cleared: whatever was on ' +
          'the card becomes unreachable. The system area is not touched.')}</p>
      <div class="asks">
        <button disabled=${!ok || busy} onClick=${go}
                >${arm ? t('once more — lay the card out') : t('lay out the card')}</button>
      </div>`}
    ${say && html`<p class="note">${say}</p>`}
  </div>`;
}

function Meta() {
  const [open, setOpen] = usePop('drive');
  const [arm, setArm] = useState(false);
  const [said, setSaid] = useState('');
  useEffect(() => { if (!open) { setArm(false); setSaid('') } }, [open]);

  /* СБРОС ПРИВОДА -- со второго нажатия, как ВВОД и СБР у платы: если
     «Вектор» как раз пишет на диск, сброс оборвёт запись. Плата отвечает
     сразу, «начат» (firmware/http.c, /api/reset), а чем кончилось -- видно по полю
     drive в /api/info: его и спрашиваем несколько раз, не дожидаясь опроса. */
  const reset = async () => {
    if (!arm) { setArm(true); return }
    setArm(false);
    setSaid(t('resetting the drive…'));
    try {
      await api('/api/reset', { method: 'POST' });
      for (const ms of [500, 1500, 3000, 6000]) setTimeout(ask_board, ms);
      setSaid('');
    } catch (e) { setSaid(why(e)) }
  };

  if (!info) return html`<div class="meta"><span>${t('connecting…')}</span></div>`;
  const mb = info.sectors * info.sector_size / 1048576;
  /* Модель, серийник и объём — под подсказку. Их читают один раз за сессию, а
     место в шапке они занимали бы постоянно и ровно столько же, сколько то, на
     что смотрят: состояние привода и режим записи. Эти двое и остаются
     снаружи, показателями.
     Число дискет и так стоит в строке обхода, а 1570 секторов — константа
     разметки: она не про этот винт и в заголовке ничего не сообщает. */
  /* Привод бывает ровно в четырёх состояниях, их перечисляет сама плата
     (drive_word в firmware/http.c): unknown — ещё не трогали, resetting — идёт
     сброс, ready — готов, dead — не ожил за отведённый срок. Всё, кроме
     ready, — повод посмотреть на шлейф, оттого и красным. */
  const rows = [
    [t('source'), info.model || '—'],
    [t('serial'), info.serial || '—'],
    [t('capacity'), t('%1 sectors', info.sectors.toLocaleString('en')) +
                    (mb > 99999 ? '' : ` · ${t('%1 MB', mb.toFixed(1))}`)],
    [t('sector'), t('%1 bytes', info.sector_size)],
    /* Без числа секунд, и это не упрощение ради краткости.
     *
     * Окно берётся на те секунды, что идёт применение, и отпускается следом —
     * руками его никто не трогает, а «300 с после снятия замка» описывало бы
     * механику, которой человек не управляет. Применение укладывается в окно всегда, так что число ничего не
     * решает и только выглядит важным, потому что точное.
     *
     * Что осталось: плата на чтение — писать нельзя вовсе; окно в ноль — плата
     * принимает запись без всякого спроса, и вот это знать стоит. */
    [t('writes'), info.read_only ? t('refused — the board is read-only')
                : info.write_window ? t('allowed')
                                    : t('allowed — no lock at all')],
  ];
  return html`<div class="meta">
    <button class=${'pill lamp' + (info.drive === 'ready' ? ' ok' : ' bad')}
            data-tip=${t('what the board says about the drive')}
            onClick=${e => { e.stopPropagation(); setOpen(o => !o) }}
            >${t('drive %1', t(info.drive))}</button>
    ${open && html`<div class="pop" onClick=${e => e.stopPropagation()}>
      ${rows.map(([k, v]) => html`<div key=${k}><span>${k}</span><b>${v}</b></div>`)}
      <div class="asks">
        <button data-tip=${t('restarts the drive; a write of the Vector in progress is cut off')}
                onClick=${reset}
                >${arm ? t('once more — the drive restarts') : t('reset the drive')}</button>
      </div>
      ${said && html`<p class="note">${said}</p>`}
    </div>`}
    ${/* «Вектор» сам писал на диск с тех пор, как мы читали каталоги. Значит
         показанное могло устареть: у машины каталог в ОЗУ, и она сбрасывает
         его на диск когда сочтёт нужным. Отказ на Apply это поймает и так,
         сверив каталог, — но узнавать о таком в конце работы обидно, поэтому
         плашка стоит с самого начала и предлагает перечитать. */''}
    ${info.vector_touched && html`<button class="pill mode warn"
            data-tip=${t('the Vector wrote to the disk itself — what you see may be stale')}
            onClick=${e => { e.stopPropagation();
                             rescan((m, k) => toast(m, k)) }}
            >${t('the Vector touched the drive')}</button>`}
    ${/* Плашка только когда есть что сообщить — то есть когда плата прошита
         без записи. Обычный случай молчит: постоянное «чтение и запись»
         читалось бы как состояние замка, а замок берётся на те секунды, что идёт
         запись, и в шапке не отражается вовсе. Плашка, горящая всегда, ничего
         не сообщает, зато обещает. */''}
    ${info.read_only && html`<span class="pill mode warn"
      data-tip=${t('the board refuses writes — it was flashed read-only')}
      >${t('read-only')}</span>`}
  </div>`;
}

/* Короткие имена языков для переключателя. Не флаг: флагом называют страну, а
 * не язык — на английском говорят далеко не в одной, — да и вешать государст-
 * венный символ в морду железки незачем. Две буквы читаются мгновенно и в лю-
 * бом размере, а полное название висит подсказкой, на своём же языке. */
const LANG_SHORT = { en: 'En', ru: 'Ru' };

/* --------------------------------------------------------------- справка
 *
 * Что морда умеет — одним списком. Заведена оттого, что почти всё здесь
 * делается перетаскиванием, а перетаскивание себя не объявляет: подсказки
 * висят на значках, но их надо сперва найти, и «диск на диск это обмен»
 * ниоткуда не следует.
 *
 * Строки короткие и парами «что нажать — что будет»: справку читают, когда
 * что-то не получилось, а не изучают заранее. Каждая проходит через t() —
 * значит проверка полноты следит и за ней.
 *
 * Сочетания клавиш перечислены ВСЕ, какие есть. Их немного, и выдумывать
 * недостающие ради красоты раздела не стоит: справка, обещающая то, чего нет,
 * хуже её отсутствия.
 */
function Help() {
  useEffect(() => {
    if (!st.help) return;
    const esc = e => { if (e.key === 'Escape') { st.help = false; bump() } };
    addEventListener('keydown', esc);
    return () => removeEventListener('keydown', esc);
  }, [st.help]);

  if (!st.help) return null;
  const close = () => { st.help = false; bump() };
  return html`<div class="veil" onClick=${close}>
    <div class="help" onClick=${e => e.stopPropagation()}>
      <div class="hhead"><b>${t('What this can do')}</b>
        <button class="sm" onClick=${close}>${t('Close')}</button></div>
      ${HELP.map(([title, rows]) => html`<section key=${title}>
        <h3>${t(title)}</h3>
        ${rows.map(([what, does]) => html`<div key=${what} class="hrow">
          <b>${t(what)}</b><span>${t(does)}</span></div>`)}
      </section>`)}
    </div>
  </div>`;
}

function ThemePick() {
  return html`<div class="lang theme">
    ${[['dark', ICON_MOON, t('dark theme')], ['light', ICON_SUN, t('light theme')]]
      .map(([k, icon, name]) => html`
        <button key=${k} class=${'lng' + (st.theme === k ? ' on' : '')}
          data-tip=${name} aria-label=${name}
          onClick=${() => { st.theme = k; pref_set('theme', k); wear_theme(); bump() }}
          >${icon}</button>`)}
  </div>`;
}

/* Выбор языка. Стоит в шапке последним: его трогают раз и забывают.
 *
 * Названия языков НЕ переводятся — они и так на своём языке: человек, попавший
 * на английскую морду по ошибке, ищет глазами слово «Русский», а не его
 * английское имя. */
function LangPick() {
  return html`<div class="lang">
    ${Object.entries(LANGS).map(([k, name]) => html`
      <button key=${k} class=${'lng' + (st.lang === k ? ' on' : '')}
        data-tip=${name} aria-label=${name}
        onClick=${() => { st.lang = k; pref_set('lang', k); bump() }}
        >${LANG_SHORT[k]}</button>`)}
  </div>`;
}

/* Корзина архива в шапке. Стоит на виду постоянно, даже пустая: это цель для
 * броска, а цель, которой не видно, не цель. */
function Basket() {
  const [open, setOpen] = usePop('basket');
  const [over, setOver] = useState(false);
  /* Ход применения — всплывашкой: строка между перечнем и кнопками наполнялась
     бы во время записи и толкала «Apply» вправо ровно тогда, когда за ней
     следят. */
  const say = (text, cls) => toast(text, cls);


  const items = [...basket.entries()];
  const bytes = items.reduce((s_, [, it]) => s_ + it.data.length, 0);

  return html`<div class="basket">
    <button class=${'zip' + (over ? ' over' : '') + (items.length ? ' full' : '')}
      data-tip=${items.length
        ? t('%1 · %2 — click to see and save',
            plural(items.length, 'item', 'items'), kb(bytes))
        : t('drag disks and files here, then save them as one .zip')}
      aria-label=${t('archive')}
      onClick=${e => { e.stopPropagation(); setOpen(o => !o) }}
      onDragOver=${e => {
        const ty = e.dataTransfer.types;
        if (!ty.includes(DRAG_FILE) && !ty.includes(DRAG_FLOPPY)) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'copy';   /* в корзину всегда копия */
        if (!over) setOver(true);
      }}
      onDragLeave=${() => setOver(false)}
      onDrop=${e => {
        e.preventDefault();
        setOver(false);
        const carried = e.dataTransfer.getData(DRAG_FILE);
        const from = e.dataTransfer.getData(DRAG_FLOPPY);
        if (carried) {
          const { floppy, keys } = JSON.parse(carried);
          st.dragging_files = 0;
          basket_take_files(floppy, keys);
        } else if (from) {
          st.from = 0; st.drag = 0;
          basket_take_floppy(+from);
        }
      }}>${ICON_ZIP}${items.length ? html`<b>${items.length}</b>` : ''}</button>

    ${open && html`<div class="pop wide" onClick=${e => e.stopPropagation()}>
      ${!items.length
        ? html`<p class="note">${t('Nothing here yet. Drag disks or files onto the ' +
                 'archive icon — they are read right away, so whatever happens to ' +
                 'them later, you get what you saw here.')}</p>`
        : html`
          ${items.map(([k, it]) => html`<div key=${k} class="row">
            <span class="nm">${it.name}</span>
            <b>${kb(it.data.length)}</b>
            <button class="act del" aria-label=${t('remove')}
              data-tip=${t('remove from the archive')}
              onClick=${() => { basket.delete(k); say('', ''); bump() }}
              >${ICON_TRASH}</button>
          </div>`)}
          <div class="foot">
            <span class="note">${plural(items.length, 'item', 'items')} · ${kb(bytes)}</span>
            <button class="sm" onClick=${() => { basket.clear(); toast(''); bump() }}
              >${t('Clear all')}</button>
            <button class="go" onClick=${() => basket_save(say)}>${t('Save .zip')}</button>
          </div>`}
    </div>`}
  </div>`;
}

function Login({ why, onDone }) {
  const [msg, setMsg] = useState(why || '');
  const [busy, setBusy] = useState(false);
  const box = useRef();

  const go = async () => {
    setBusy(true);
    setMsg('');
    try {
      await login(box.current.value.trim());
      box.current.value = '';               /* секрет нигде не задерживается */
      onDone();
    } catch (e) {
      setMsg(e.message);
      setBusy(false);
    }
  };

  return html`<section id="login">
    <div class="card">
      <h2>${t('Sign in')}</h2>
      <p class="note">${t('The board secret — printed to its console on first start. ' +
        'Needed once: the session key is derived from it and the board\'s challenge, ' +
        'and lives until this tab is closed. The secret itself is not stored here.')}</p>
      <p class="note">${t('Neither the secret nor the key travels over the network — ' +
        'the board derives the same key on its side. Only request signatures go on ' +
        'the wire, and they cannot be replayed.')}</p>
      <div class="bar">
        <label>${t('secret')}<input type="password" ref=${box} size="40"
                            autocomplete="current-password" placeholder=${t('128-bit hex')}
                            onKeyDown=${e => e.key === 'Enter' && go()}/></label>
        <button class="go" disabled=${busy} onClick=${go}>${t('Sign in')}</button>
      </div>
      <p class="note err">${msg}</p>
    </div>
  </section>`;
}

/* --------------------------------------------------------------- настройка
 *
 * Экран, который человек видит, подключившись к точке самой платы. Плата сюда
 * попадает, когда сети нет: её не настраивали ни разу, или та, что была,
 * пропала — сменили пароль, переехали, поменяли роутер.
 *
 * Здесь же показывается СЕКРЕТ ПЛАТЫ, и только здесь. Он печатается в UART при
 * первом запуске, а шнурка у платы в машине нет; не покажи мы его тут, войти в
 * морду было бы нечем. Отдаёт его плата лишь пока сеть ни разу не настраивали
 * — см. api_setup.
 */
function Setup() {
  const [nets, setNets] = useState(null);
  const [pick, setPick] = useState('');
  const [pass, setPass] = useState('');
  const [busy, setBusy] = useState(false);
  const [done, setDone] = useState('');
  const [secret, setSecret] = useState('');

  const look = async () => {
    setNets(null);
    try {
      const r = await (await fetch('/api/setup/nets')).json();
      setNets(r);
      /* Сразу выбираем сильнейшую: чаще всего это и есть своя сеть, и человеку
         остаётся только ввести пароль. */
      if (r.length && !pick) setPick(r[0].ssid);
    } catch (e) { setNets([]) }
  };

  useEffect(() => {
    look();
    fetch('/api/setup').then(r => r.json())
      .then(d => setSecret(d.secret || '')).catch(() => {});
  }, []);

  const join = async () => {
    if (!pick) return;
    setBusy(true);
    try {
      const r = await fetch('/api/setup/join', { method: 'POST',
        body: JSON.stringify({ ssid: pick, pass }) });
      if (!r.ok) throw new Error(String(r.status));
      setDone(pick);
    } catch (e) {
      /* Обрыв здесь — обычное дело, а не беда: плата перезагружается сразу за
         ответом, и он не всегда успевает дойти. Сказать «не вышло» было бы
         неправдой чаще, чем правдой. */
      setDone(pick);
    }
    setBusy(false);
  };

  if (done) return html`<section id="login"><div class="card">
    <h2>${t('Saved')}</h2>
    <p class="note">${t('The board is restarting and joining “%1”. It will get its ' +
      'address from your router — look for it there, or plug the board in and read ' +
      'the log. This page is served by the board itself and will stop answering.', done)}</p>
    ${secret && html`<p class="note"><b>${t('the secret')}: ${secret}</b></p>`}
  </div></section>`;

  return html`<section id="login"><div class="card">
    ${/* Переключатель языка ЗДЕСЬ, хотя во всей морде он в шапке: шапки на этом
         экране нет, а экран — первый, что человек видит от платы вообще. Язык
         угадывается по браузеру и чаще всего угадывается верно, но «чаще всего»
         для первого экрана мало. */''}
    <div class="setup-lang"><${LangPick}/></div>
    <h2>${t('Set up the board')}</h2>
    <p class="note">${t('The board could not join a network, so it put up its own. ' +
      'Pick yours and give the password — it is stored on the board, not here.')}</p>

    ${secret && html`<p class="note err">${t('Write down the board secret — you will ' +
      'need it to sign in, and it is shown only now: %1', secret)}</p>`}

    <div class="bar">
      <label>${t('network')}
        <select value=${pick} onChange=${e => setPick(e.target.value)}>
          ${(nets || []).map(n => html`<option key=${n.ssid} value=${n.ssid}>
            ${n.ssid} · ${t('%1 dBm', n.rssi)}${n.secure ? '' : ' · ' + t('open')}
          </option>`)}
        </select>
      </label>
      <button class="sm" onClick=${look}>${t('look again')}</button>
    </div>
    ${nets === null && html`<p class="note">${t('looking around…')}</p>`}
    ${nets && !nets.length && html`<p class="note err">${t('nothing in the air')}</p>`}

    <div class="bar">
      <label>${t('password')}<input type="password" value=${pass} size="28"
             autocomplete="off"
             onInput=${e => setPass(e.target.value)}
             onKeyDown=${e => e.key === 'Enter' && join()}/></label>
      <button class="go" disabled=${busy || !pick} onClick=${join}
              >${busy ? t('joining…') : t('Join')}</button>
    </div>
  </div></section>`;
}

/* Что видно под курсором, когда тащат пачку файлов.
 *
 * Браузер рисует ровно тот элемент, за который взялись, и выделенные рядом ему
 * безразличны: тянешь три файла — под курсором один. Своя картинка исправляет
 * ровно это и ничего больше; когда файл один, оставляем browser'у его же
 * умолчание — оно и понятнее, и привычнее.
 *
 * Элемент обязан быть В ДОКУМЕНТЕ на миг вызова setDragImage, иначе браузер
 * его не увидит. Поэтому он ставится за левый край экрана и убирается в
 * следующем такте — к тому времени картинка уже снята. */
function drag_ghost(e, count) {
  if (count < 2 || !e.dataTransfer.setDragImage) return;

  /* КОЛОДА ИЗ САМИХ ПЛИТОК, а не надпись «7 файлов».
   *
   * Тащат ведь файлы, и видеть человек хочет их: одну плитку, когда файл один,
   * стопку — когда много. Надпись отвечала на вопрос «сколько», но не на
   * вопрос «что», а он важнее: с чем именно ты сейчас едешь, видно только по
   * именам. */
  let picked = [...document.querySelectorAll('.ftile.sel')];
  if (!picked.length) return;

  /* Та плитка, за которую взялись, — СВЕРХУ. Карты кладутся по порядку, и
     последняя оказывается верхней; без этой перестановки сверху лежала бы
     просто последняя выделенная, а человек ждёт увидеть ту, что схватил. */
  const held = e.currentTarget;
  if (held && picked.includes(held))
    picked = [...picked.filter(x => x !== held), held];

  /* КАРТ СТОЛЬКО, СКОЛЬКО ВЫДЕЛЕНО, и шаг у них ПОСТОЯННЫЙ.
   *
   * Ограничение по числу («не больше четырёх») врало бы о главном: тянешь
   * двадцать файлов, видишь четыре и приписку. Толщина стопки — сама по себе
   * ответ на вопрос «много ли», и отнимать его не стоит.
   *
   * ОДНА точка на карту. Сжимать шаг под число выделенных хуже: у одной и той
   * же пачки стопка выглядела бы по-разному в зависимости от того, сколько в
   * ней штук, и глазу не за что было бы зацепиться. Постоянный
   * шаг делает толщину прямой мерой количества: вдвое больше файлов — вдвое
   * толще стопка.
   *
   * Точка, а не три, выбрана на глаз, на живой плате: при трёх стопка из пары
   * файлов выглядела грубовато, при одной — аккуратная кромка, а на полной
   * дискете набирается заметные двадцать три точки. Цена такого выбора в том,
   * что на двух-трёх файлах кромка тонка; если однажды это помешает, менять
   * надо здесь и смотреть глазами — числом это не проверяется. */
  const STEP = 1;
  const cards = picked;
  const step = STEP;
  const box = document.createElement('div');

  box.className = 'ghost';
  /* Отступ слева и сверху — под курсор. Он рисуется поверх картинки, и без
     запаса накрывает первое, что в ней есть: имя файла прочесть нельзя. */
  box.style.width  = (cards[0].offsetWidth + step * (cards.length - 1) + 20) + 'px';
  box.style.height = (cards[0].offsetHeight + step * (cards.length - 1) + 20) + 'px';

  cards.forEach((el, i) => {
    const c = el.cloneNode(true);
    c.classList.remove('sel', 'lift');
    c.style.left = (20 + i * step) + 'px';
    c.style.top  = (20 + i * step) + 'px';
    c.style.width = cards[0].offsetWidth + 'px';
    box.appendChild(c);
  });

  document.body.appendChild(box);
  try { e.dataTransfer.setDragImage(box, 0, 0) } catch (err) { /* не судьба */ }
  setTimeout(() => box.remove(), 0);
}

/* Метка «как будет»: отложенная перекрывает лежащую на диске. */
function label_of(n) {
  const p = pending.get('label:' + n);
  return p ? p.text.trim() : (labels.get(n) || '');
}

/* ------------------------------------------------------------------ значки
 *
 * Рисуются здесь, а не берутся картинками: их шесть, каждый в полсотни байт,
 * и отдельные запросы к плате ради этого ни к чему. Цвет — currentColor, чтобы
 * значок сам перекрашивался вместе с плиткой: подсвеченной поиском, свежей,
 * приглушённой.
 *
 * Набор типов взят по РАСКЛАДУ ДИСКА, а не из общих соображений: .COM это 36%
 * файлов, .STM (музыкальные модули, в заголовке «SONG BY ST») — 23%, .BAS —
 * 18%. Вместе со шрифтами, картинками и настройками это около 85%; остальные
 * шестьдесят с лишним расширений получают общий значок.
 *
 * Что есть что — проверено содержимым, а не угадано по имени: .ZG1 это ровно
 * 2048 байт, 256 знаков по восемь байт (в DYRKA.ZG1 первый же знак — рожица
 * 7E 81 BD 81 A5 81 7E), а .ZGR это настройки: CO.ZGR — 128 байт со списком
 * «CO.PRM, CO.MNU». Про .EXT, .MNU и .PRM то же самое сказал автор диска.
 */
/* Поле обрезано по чернилам: рисунок лежит в 2..14 по обеим осям, штрих 1.5,
 * значит краска занимает 1.25..14.75 — это и есть viewBox. Тогда поле и есть
 * значок, без невидимых полей по краям, и размер задаётся ровно один. */
const svg = kids => html`<svg viewBox="1.25 1.25 13.5 13.5" fill="none"
  stroke="currentColor" stroke-width="0.85" stroke-linecap="round"
  stroke-linejoin="round">${kids}</svg>`;

/* Все значки нарисованы в одних границах: по вертикали ровно 2..14 из 16.
 * Тогда высота задаётся один раз в CSS и одинаково идёт всем, а не подгоняется
 * каждому. Размер — в em, чтобы значок был вровень с буквой, а не выше строки.
 */

/* Дискета — привычная «иконка сохранения»: срезанный угол, задвижка сверху,
 * этикетка в строчку снизу.
 *
 * Она трёхдюймовая, а на «Векторе» были пятидюймовые, и это выбор в пользу
 * узнаваемости, а не точности. У пятидюймовой ступица с прорезью под ней
 * складывается в замочную скважину, ступица без прорези — в компакт-диск, а в
 * размере плитки любая из них превращается в пятно. Эта же читается и в двадцать семь точек. */
const ICON_FLOPPY = svg(html`
  <path d="M3.2 2h8.2L14 4.6v7.2a2.2 2.2 0 0 1-2.2 2.2H4.2A2.2 2.2 0 0 1 2 11.8V4.2A2.2 2.2 0 0 1 4.2 2z"/>
  <path d="M6 2v2.7h4V2"/>
  <rect x="4.4" y="8" width="7.2" height="6" rx="0.4"/>
  <path d="M6.1 9.9h3.8M6.1 11.2h3.8M6.1 12.5h3.8"/>`);

/* Солнце и месяц для выбора темы. Месяц — просто серп, без звёзд и без лица:
 * в шестнадцать точек любая подробность превращается в грязь. */
const ICON_SUN = svg(html`<circle cx="8" cy="8" r="3.1"/>
  <path d="M8 1.6v1.7M8 12.7v1.7M1.6 8h1.7M12.7 8h1.7M3.5 3.5l1.2 1.2M11.3 11.3l1.2 1.2M12.5 3.5l-1.2 1.2M4.7 11.3l-1.2 1.2"/>`);

const ICON_MOON = svg(html`<path d="M13 9.6A5.6 5.6 0 0 1 6.4 3a5.6 5.6 0 1 0 6.6 6.6z"/>`);

/* Лупа в поле поиска. Своя, а не из набора файлов: у неё другой размер и своё
 * место, внутри поля. */
const ICON_FIND = svg(html`<circle cx="7" cy="7" r="4.6"/><path d="M10.4 10.4 14 14"/>`);

/* Действия на плитке файла. Мельче тех, что показывают род: те держат столбец,
 * а эти стоят в строке имени рядом с текстом. */
const ICON_DOWN  = svg(html`<path d="M8 2.4v8.2M4.6 7.4 8 10.8l3.4-3.4M2.8 13.6h10.4"/>`);
/* Архив: коробка с крышкой и прорезью — так его рисуют везде, и опознаётся он
 * без подписи. Прорезь на крышке, а не замок на боку: замок в тринадцать точек
 * превращается в пятно. */
const ICON_ZIP = svg(html`
  <rect x="2" y="4.6" width="12" height="9.4" rx="1"/>
  <path d="M2 7.4h12"/>
  <path d="M2.6 4.6 4.4 2h7.2l1.8 2.6"/>
  <path d="M7 10h2"/>`);

const ICON_TRASH = svg(html`<path d="M2.6 4.4h10.8M6.4 4.4V2.6h3.2v1.8"/>
  <path d="M4 4.4l.7 9h6.6l.7-9"/><path d="M6.6 6.8v4.4M9.4 6.8v4.4"/>`);

const ICONS = {
  /* Программа: микросхема с выводами. */
  exec: svg(html`<rect x="4.4" y="4.4" width="7.2" height="7.2" rx="1"/>
    <path d="M6.6 4.4V2M9.4 4.4V2M6.6 14v-2.4M9.4 14v-2.4M4.4 6.6H2M4.4 9.4H2M14 6.6h-2.4M14 9.4h-2.4"/>`),
  /* Музыка: нота. */
  music: svg(html`<path d="M6.2 12.7V3.4l7-1.4v8.7"/>
    <ellipse cx="4.6" cy="12.7" rx="1.6" ry="1.3"/>
    <ellipse cx="11.6" cy="10.7" rx="1.6" ry="1.3"/>`),
  /* Исходник: угловые скобки и косая черта. */
  code: svg(html`<path d="M5.6 3 2 8l3.6 5M10.4 3 14 8l-3.6 5M9.7 2.2 6.3 13.8"/>`),
  /* Настройки: ползунки. Отличать их от текста стоит: читать их всё равно
     некому, кроме той программы, которой они принадлежат. */
  config: svg(html`<path d="M2 4.2h2.4M8.8 4.2H14M2 11.8h5.2M11.6 11.8H14"/>
    <circle cx="6.6" cy="4.2" r="2.2"/><circle cx="9.4" cy="11.8" r="2.2"/>`),
  /* Пакетный файл: приглашение в окне. Это команды, а не текст и не программа. */
  batch: svg(html`<rect x="2" y="2" width="12" height="12" rx="1"/>
    <path d="M4.8 5.8 7.2 8l-2.4 2.2M8.6 10.4h3"/>`),
  /* Картинка: рамка, солнце и горы. */
  image: svg(html`<rect x="2" y="2" width="12" height="12" rx="1"/>
    <circle cx="5.5" cy="5.8" r="1.2"/>
    <path d="M2.4 12.8 6 9.2l2.4 2.4L10.6 8.4l3 4.4"/>`),
  /* Шрифт: буква. Их тут заметно — .ZG1 это ровно 2048 байт, 256 знаков по
     восемь байт на клетку 8x8. */
  font: svg(html`<path d="M2.9 14 8 2l5.1 12M5.3 10.4h5.4"/>`),
  /* Текст: лист со строками. */
  text: svg(html`<path d="M3.6 2h5.6l3.2 3.2V14H3.6z"/>
    <path d="M9.2 2v3.2h3.2M5.6 7.6h4.8M5.6 9.8h4.8M5.6 12h3"/>`),
  /* Прочее: лист с загнутым углом и без строк. */
  data: svg(html`<path d="M3.6 2h5.6l3.2 3.2V14H3.6z"/>
    <path d="M9.2 2v3.2h3.2"/>`),
};

/* Расширение -> род. Всё, чего здесь нет, получает общий значок.
 *
 * C0M и R0M — не опечатка: это те же программы, но грузящиеся с нулевого
 * адреса, а не со 100h. Значок им тот же: различие не в роде файла. */
const BY_EXT = {
  COM: 'exec',   ROM: 'exec',   C0M: 'exec',   R0M: 'exec',  CMD: 'exec',
  STM: 'music',  STL: 'music',  MUS: 'music',  SND: 'music',
  BAS: 'code',   ASM: 'code',   MAC: 'code',
  SUB: 'batch',  BAT: 'batch',
  EXT: 'config', ZGR: 'config', MNU: 'config', PRM: 'config',
  SPR: 'image',  PCX: 'image',  IMG: 'image',  PIC: 'image',
  ZG1: 'font',   ZG2: 'font',   ZG3: 'font',   ZG4: 'font',  FNT: 'font',
  TXT: 'text',   DOC: 'text',   HLP: 'text',   PPA: 'text',  ME: 'text',
};

/* Название рода — в подсказку: по одному значку род угадывается не всегда, а
 * заводить подпись под каждой плиткой ради этого незачем. */
const file_kind = name => {
  const dot = name.lastIndexOf('.');
  return BY_EXT[dot < 0 ? '' : name.slice(dot + 1)] || 'data';
};
const file_icon = name => ICONS[file_kind(name)];

/* Порядок родов при сортировке по типу. Задан списком, а не по алфавиту ключей:
 * рядом должно оказаться то, что рядом и ищут — сперва то, что запускается,
 * потом исходники и настройки, дальше содержимое. */
const KIND_ORDER = ['exec', 'batch', 'code', 'config', 'font', 'image', 'music',
                    'text', 'data'];

const SORTS = {
  name: (a, b) => a.name.localeCompare(b.name),
  /* По типу — с именем вторым ключом, иначе внутри рода порядок был бы случаен
     на глаз. */
  type: (a, b) => (KIND_ORDER.indexOf(file_kind(a.name)) -
                   KIND_ORDER.indexOf(file_kind(b.name))) ||
                  a.name.localeCompare(b.name),
  /* По размеру — крупные сверху: ищут обычно то, что съело место. */
  size: (a, b) => (b.size - a.size) || a.name.localeCompare(b.name),
};

const DRAG_FLOPPY = 'application/x-combo-floppy';
const DRAG_FILE   = 'application/x-combo-file';

function Tile({ n, onOpen, off }) {
  /* Взведённое стирание — у каждой плитки своё: подтверждать «ту дискету, что
     сейчас взведена» на трёхстах плитках было бы страшно. */
  const [armed, setArmed] = useState(false);

  /* Спрятанная плитка остаётся в списке, но не считает ничего: иначе триста
     двадцать четыре разбора каталога на каждую перерисовку, включая набор в
     поле поиска. Узел при этом тот же, и перетаскивание от него не страдает.
     Возврат стоит ПОСЛЕ useState: порядок хуков менять нельзя. */
  if (off) return html`<div class="tile off"></div>`;

  /* Плитка показывает МЕСТО n, а содержимое — той дискеты, что на нём окажется.
     Пока перестановка не применена, это разные вещи, и данные надо брать по
     src: скачивание тоже читает пока ещё старое место. */
  const src = src_of(n), moved = src !== n;
  const cat = cat_of(src), why = bad.get(src);
  const changed = projected.has(src) || images.has(src);
  const lab = label_of(src), edited = pending.has('label:' + src);
  const known = cat !== undefined;
  const used = known ? cat.reduce((s, f) => s + f.size, 0) : 0;
  const empty = known && !cat.length;

  /* При поиске плитка говорит, СКОЛЬКО в ней попало: иначе видно только то,
     что дискета попала хоть чем-то, а одно совпадение и двадцать выглядят
     одинаково. */
  const pat = st.find.trim();
  const hits = pat && known ? cat.filter(f => match(pat, f.name)).length : 0;

  let cnt;
  if (why)         cnt = html`<span class="err">${t('failed')}</span>`;
  else if (!known) cnt = '…';
  else if (empty)  cnt = t('empty');
  else if (pat)    cnt = html`<em>${t('%1 of %2 match', hits, cat.length)}</em>`;
  else             cnt = `${plural(cat.length, 'file', 'files')} · ${kb(used)}`;

  /* Что именно тащат, видно уже во время перетаскивания: сама дискета — по
     своему типу данных, внешние файлы — по 'Files'. Прочитать содержимое
     переноса до броска браузер не даёт намеренно, а типы даёт. */
  const dragging_floppy = st.from > 0;
  const hot = st.drag === n;

  return html`<div class=${'tile' + (empty || why ? ' empty' : '') +
                           (n === st.open ? ' sel' : '') +
                           (changed || moved ? ' changed' : '') +
                           (hot && !dragging_floppy && !st.dragging_files ? ' over' : '') +
                           (hot && st.dragging_files ? ' take' : '') +
                           (hot && dragging_floppy && st.from !== n ? ' swap' : '') +
                           (st.from === n ? ' lift' : '')}
                   draggable=${!why}
                   onClick=${() => !why && onOpen(n)}
                   onDragStart=${e => {
                     e.dataTransfer.setData(DRAG_FLOPPY, String(n));
                     /* copyMove, хотя обмен дискет — это именно перенос: в
                      * корзину архива дискета ложится КОПИЕЙ, а браузер не
                      * шлёт drop вовсе, когда dropEffect приёмника не
                      * укладывается в объявленное здесь. Поэтому здесь
                      * разрешены оба, а каждый приёмник называет своё. */
                     e.dataTransfer.effectAllowed = 'copyMove';
                     st.from = n; bump(); begin_drag();
                   }}
                   onDragEnd=${() => { st.from = 0; st.drag = 0; bump() }}
                   onDragOver=${e => {
                     e.preventDefault();
                     /* Shift — перенос, иначе копия. Читаем прямо тут: к броску
                        клавишу могут и отпустить, а указатель обязан показывать
                        то, что будет. */
                     /* Файл на чужой диск — копия; диск на диск — обмен. */
                     e.dataTransfer.dropEffect =
                       e.dataTransfer.types.includes(DRAG_FILE) ? 'copy' : 'move';
                     if (st.drag !== n) { st.drag = n; bump() }
                   }}
                   onDragLeave=${() => { if (st.drag === n) { st.drag = 0; bump() } }}
                   onDrop=${e => {
                     e.preventDefault();
                     const carried = e.dataTransfer.getData(DRAG_FILE);
                     const from = e.dataTransfer.getData(DRAG_FLOPPY);
                     st.drag = 0; st.from = 0; st.file = null;
                     if (carried) {
                       const { floppy, keys } = JSON.parse(carried);
                       st.dragging_files = 0;
                       move_files(floppy, src, keys);
                     } else if (from) {
                       /* Отказ виден в верхней строке; удавшийся обмен её
                          гасит, иначе прошлая жалоба висела бы вечно. */
                       try { undoable(t('swap disks %1 and %2', num(+from), num(n)),
                                  () => stage_swap(+from, n)); toast('') }
                       catch (err) { toast(why(err), 'err') }
                     } else {
                       /* Образ дискеты и отдельные файлы — разные вещи, и
                          путать их нельзя: образ ложится на ВСЮ дискету. Как
                          их различать — см. pick_image. */
                       drop_outside(src, [...e.dataTransfer.files]);
                     }
                   }}>
    ${ICON_FLOPPY}
    <div class="body">
      ${/* Откуда придёт содержимое — рядом с НОМЕРОМ, а не в строке счётчика:
             там место кончается на длинных подписях и «с 6» обрезается. Здесь
             место есть всегда, а стрелка говорит то же и короче. */''}
      <div class="no"><b>${num(n)}</b>${
        moved ? html`<span class="was" data-tip=${
          t('shows disk %1 — swap not applied yet', num(src))}>← ${num(src)}</span>` : ''}${
        hot && dragging_floppy && st.from !== n
          ? html`<span class="swapb">⇄ ${num(st.from)}</span>`
          : html`<span class="acts">
              ${/* Те же две кнопки и там же, где они у файла, — чтобы плитка
                   дискеты и плитка файла читались одинаково. Щелчок по ним не должен раскрывать дискету,
                   отсюда stopPropagation на каждой. */''}
              ${/* У пустого диска скачивать нечего: образ вышел бы из одних E5h,
                     и такой файл никому не нужен. */''}
              ${known && !empty && html`<button class="act" aria-label=${t('save as .fdd')}
                data-tip=${t('save this disk as a .fdd image')}
                onClick=${e => { e.stopPropagation(); download_fdd(src, toast) }}
                >${ICON_DOWN}</button>`}
              ${known && !empty && html`<button
                class=${'act del' + (armed ? ' armed' : '')}
                aria-label=${t('erase disk')}
                data-tip=${armed ? t('click again to erase the directory')
                              : t('erase the whole directory; data blocks are left as they are')}
                onBlur=${() => setArmed(false)}
                onClick=${e => {
                  e.stopPropagation();
                  if (!armed) { setArmed(true); return }
                  setArmed(false);
                  undoable(t('erase disk %1', num(src)), () =>
                    toast(t('disk %1: erased %2', num(src),
                            plural(stage_erase(src), 'entry', 'entries')), 'ok'));
                }}>${ICON_TRASH}</button>`}
            </span>`}</div>
      <div class=${'lab' + (edited ? ' edited' : '')}>${lab}</div>
      <div class="cnt">${cnt}</div>
      <div class="fill"><i style=${
        `width:${known ? Math.min(100, used * 100 / CAP) : 0}%`}></i></div>
    </div>
  </div>`;
}

/* Правка метки. Пишется она в ОДИН сектор, лежащий за блоками файлов, поэтому
 * задеть данные не может физически — самая безопасная запись из возможных. */
function LabelEdit({ n }) {
  const [text, setText] = useState(label_of(n));
  /* Отказ уходит всплывашкой: строка рядом с полем толкала бы всю шапку панели. */
  const disk = labels.get(n) || '';

  /* Пересинхронизация не только при смене дискеты, но и когда метка сменилась
     помимо поля: её стирает очистка, её ставит принесённый образ. Без этого в
     поле оставалось бы прежнее, и потеря фокуса вернула бы стёртое обратно.
     Набору это не мешает: label_of меняется только на сохранении. */
  useEffect(() => { setText(label_of(n)) }, [n, label_of(n)]);

  const commit = () => {
    if (!label_ok(text)) { toast(t('this character has no place in KOI-8'), 'err'); return }
    toast('');
    undoable(t('label on disk %1', num(n)),
         () => stage({ kind: 'label', floppy: n, text,
                       same_as_disk: text.trim() === disk }));
  };

  /* Без подписи «label»: пустое поле само говорит «no label», а полное показывает
     метку — слово рядом ничего не добавляло и место занимало. */
  return html`<label class="inline lbl">
    <input type="text" maxlength=${LAB_LEN} placeholder=${t('no label')} value=${text}
           data-tip=${t('disk label')}
           onInput=${e => setText(e.target.value)}
           onBlur=${commit}
           onKeyDown=${e => {
             /* Enter сохраняет САМ, а не через потерю фокуса: полагаться на то,
                что blur() дойдёт до обработчика, — лишнее звено. */
             if (e.key === 'Enter') { commit(); e.target.blur() }
             if (e.key === 'Escape') { setText(label_of(n)); toast('') } }}/>
  </label>`;
}

/* Плитка файла. Вынесена отдельно, потому что панель теперь раскладывает файлы
 * по областям пользователя, и вкладывать её тело в двойной перебор было бы уже
 * не прочесть. */
function FileTile({ f, src, cat, pat, say }) {
  const fresh = staged_bytes.has(bkey(src, f.user, f.raw));
  /* Попавшие в поиск подсвечены, остальные приглушены, но остаются на месте:
     дискета показывается целиком, иначе не видно ни соседей, ни того, сколько
     на ней всего. */
  const hit = pat && match(pat, f.name);
  const key = fkey(f);
  const picked = st.sel.has(key);

  return html`
    <div class=${'ftile' + (fresh ? ' fresh' : '') +
                 (pat ? (hit ? ' hit' : ' miss') : '') +
                 (picked ? ' sel' : '') +
                 (picked && st.dragging_files ? ' lift' : '')}
         draggable=${true}
         onDragStart=${e => {
           /* Тянут невыделенный — выделение сбрасывается на него: иначе уехало
              бы не то, что схватили. */
           if (!st.sel.has(key)) { st.sel.clear(); st.sel.add(key); st.anchor = key }
           const keys = cat.filter(x => st.sel.has(fkey(x)))
                           .map(x => ({ user: x.user, name: x.name, raw: x.raw }));
           e.dataTransfer.setData(DRAG_FILE, JSON.stringify({ floppy: src, keys }));
           /* copyMove — чтобы браузер сам рисовал у курсора «плюс» или стрелку,
              смотря нажат ли Shift. */
           e.dataTransfer.effectAllowed = 'copyMove';
           /* Под курсором должно быть видно, СКОЛЬКО едет. Браузер рисует один
              элемент — тот, за который взялись, — и три выделенных файла
              выглядят как один: человек тащит пачку, а видит штуку. */
           drag_ghost(e, keys.length);
           st.dragging_files = keys.length;
           bump(); begin_drag();
         }}
         onDragEnd=${() => { st.dragging_files = 0; st.area_drop = -1; bump() }}
         data-tip=${`${f.name} — ${t(KIND_NAME[file_kind(f.name)])}`}
         onClick=${e => {
           /* Как в файловом менеджере: щелчок выделяет, с Ctrl или Cmd добавляет
              по одному, с Shift — целым куском от последнего выделенного.
              Скачивание — двойным щелчком. */
           e.stopPropagation();
           if (e.metaKey || e.ctrlKey) {
             picked ? st.sel.delete(key) : st.sel.add(key);
             st.anchor = key;
           } else if (e.shiftKey && st.anchor) {
             const ks = cat.map(fkey);
             const a = ks.indexOf(st.anchor), b = ks.indexOf(key);
             if (a >= 0 && b >= 0)
               ks.slice(Math.min(a, b), Math.max(a, b) + 1).forEach(k => st.sel.add(k));
           } else {
             st.sel.clear(); st.sel.add(key); st.anchor = key;
           }
           /* Сколько взято и что с этим делать — всплывашкой: в шапке панели
              эта строка появлялась бы и пропадала, толкая соседей. */
           if (st.sel.size)
             toast(t('%1 selected — drag to another disk to copy',
                     st.sel.size), 'ok');
           bump();
         }}>
      ${file_icon(f.name)}
      <div class="body">
        <div class="nm"><span>${f.name}</span>
          ${/* Кнопками, а не двойным щелчком: щелчок ничем себя не выдаёт, и
               узнать про него было неоткуда. */''}
          <button class="act" aria-label=${t('download')}
            data-tip=${t('download this file')}
            onClick=${e => {
            e.stopPropagation();
            download(src, f, say);
          }}>${ICON_DOWN}</button>
          <button class="act del" aria-label=${t('delete')}
            data-tip=${t('delete this file')}
            onClick=${e => {
            e.stopPropagation();
            try { undoable(t('delete %1', f.name),
                        () => { stage_remove(src, f.raw, f.user) }) }
            catch (err) { say(why(err), 'err') }
          }}>${ICON_TRASH}</button></div>
        <div class="sz"><span>${f.size.toLocaleString('en')}</span>
          ${/* Признаки CP/M: старшие биты девятого и десятого байта имени. Две
               буквы постороннему не говорят ничего, поэтому у них своя
               подсказка — и только про те, что и правда стоят. */''}
          <span data-tip=${[f.ro && t('R — read-only, the system refuses to change it'),
                            f.sys && t('S — system, DIR does not list it')]
                             .filter(Boolean).join('\n') || undefined}
            >${(f.ro ? 'R' : '') + (f.sys ? 'S' : '')}</span></div>
      </div>
    </div>`;
}

/* Показываем оба предела сразу: на этом винте они оба достигнуты, и «места
 * полно, а положить нельзя» без этой строки выглядит поломкой. */
function free_note(n) {
  const raw = raw_of(n);
  if (!raw) return '';
  const d = dir_stats(raw);
  return t('%1 (%2 KB) and %3 free',
           plural(d.free_blocks, 'block', 'blocks'),
           Math.round(d.free_blocks * 2),
           plural(d.free_slots, 'entry', 'entries')) +
         (d.bad_slots
            ? t(', %1 damaged', plural(d.bad_slots, 'slot', 'slots')) : '');
}

function Panel({ n, beak }) {
  const [armed, setArmed] = useState(false);
  /* Итоги и ошибки уходят ВСПЛЫВАШКОЙ, а не строкой в шапке панели. В шапке
     они появлялись бы и пропадали, и вместе с ними ездило бы всё, что стоит
     правее: кнопки уходили бы из-под курсора ровно тогда, когда в них
     целятся. */
  const say = (text, cls) => toast(text, cls);
  /* Панель озаглавлена МЕСТОМ, а показывает и читает ту дискету, что на нём
     окажется: скачивание идёт со старого места, пока перестановка не
     применена. */
  const src = src_of(n), moved = src !== n;
  const cat = cat_of(src);
  const pick = useRef();
  const pat = st.find.trim();


  /* Взведённая очистка снимается при переходе на другую дискету: подтверждение
     относится к той, на которой его нажали. */
  useEffect(() => { setArmed(false); toast('');
                    st.sel.clear(); st.anchor = ''; st.areas.clear(); bump() }, [n]);

  /* Каталог как он есть — своя копия только на чтение. proj(n) звать нельзя:
     он завёл бы изменение дискеты просто оттого, что её открыли. */
  /* Файлы разложены по областям пользователя, как их показывает CO.

     Области не существуют сами по себе — область это первый байт записи
     каталога, и «пустая область» бывает только та, что добавили в панель
     вручную, чтобы было куда положить первый файл. */
  const by_area = new Map();
  for (const f of (cat || [])) {
    if (!by_area.has(f.user)) by_area.set(f.user, []);
    by_area.get(f.user).push(f);
  }
  /* Порядок накладывается ВНУТРИ области: области сами по себе идут по номеру,
     и мешать одно с другим незачем. */
  for (const list of by_area.values()) list.sort(SORTS[st.sort] || SORTS.name);
  for (const a of (st.areas.get(src) || [])) if (!by_area.has(a)) by_area.set(a, []);
  if (!by_area.size) by_area.set(0, []);
  const areas = [...by_area.keys()].sort((a, b) => a - b);

  const raw = raw_of(src);
  const dstat = raw ? dir_stats(raw) : null;
  const dmg = raw ? new Layout(raw).bad_slots() : { safe: [], risky: [] };

  return html`<div class="panel"
                   onClick=${() => { if (st.sel.size) { st.sel.clear(); bump() } }}
                   onDragOver=${e => e.preventDefault()}
                   onDrop=${e => {
                     e.preventDefault();
